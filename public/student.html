<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线答题系统 · 学生端</title>
<style>
  :root{--primary:#4f46e5;--primary-d:#4338ca;--bg:#f5f7fb;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--ok:#16a34a;--err:#dc2626;--shadow:0 4px 16px rgba(15,23,42,.06);--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{background:linear-gradient(135deg,#0ea5e9,#4f46e5);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
  header h1{font-size:19px;font-weight:700}
  .who{font-size:13px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
  .who b{font-weight:700}
  .who button{background:rgba(255,255,255,.25);border:none;color:#fff;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:12px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1080px;margin:16px auto 0;padding:0 16px}
  .nav button{background:#fff;color:var(--primary);border:1px solid var(--border);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
  .nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  main{max-width:1080px;margin:16px auto;padding:0 16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .card h2{font-size:17px;margin-bottom:12px}
  .hidden{display:none!important}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  button.btn{background:var(--primary);color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;transition:.18s}
  button.btn:hover{background:var(--primary-d)}
  button.btn.ghost{background:#eef2ff;color:var(--primary)}
  button.btn.sm{padding:7px 14px;font-size:13px}
  button.btn.danger{background:var(--err)}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
  .exam-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
  .exam-card .info b{font-size:15px}.exam-card .info .meta{font-size:13px;color:var(--muted)}
  .q{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .q .qt{font-size:16px;font-weight:600;margin-bottom:10px}
  .opt{display:block;padding:12px 14px;border:2px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;font-size:15px;transition:.15s;background:#fff}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:#eef2ff}
  .opt.correct{border-color:var(--ok);background:#dcfce7}
  .opt.wrong{border-color:var(--err);background:#fee2e2}
  .opt .mk{float:right;font-weight:700}
  .result-head{text-align:center;padding:18px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:12px;margin-bottom:16px}
  .result-head .score{font-size:40px;font-weight:800;color:var(--primary)}
  .ana{font-size:13px;color:var(--muted);margin-top:8px;padding:8px 10px;background:#fff;border-radius:8px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .stat-box{background:#f8fafc;border-radius:12px;padding:16px;text-align:center}
  .stat-box .num{font-size:26px;font-weight:700;color:var(--primary)}
  .stat-box .lbl{font-size:13px;color:var(--muted);margin-top:4px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.choice{background:#e0e7ff;color:var(--primary)}.badge.judge{background:#dcfce7;color:var(--ok)}
  .live{position:fixed;bottom:18px;right:18px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
  .pill{display:inline-flex;gap:6px;background:#f1f5f9;padding:5px 12px;border-radius:999px;font-size:13px;margin:4px}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:14px}
  @media(max-width:640px){.opt{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>📝 在线答题系统</h1>
  <div class="who" id="who">身份：<b id="who-name">未设置</b> <button onclick="editName()">修改</button></div>
</header>

<div class="nav">
  <button data-tab="exam" class="active">考试答题</button>
  <button data-tab="classroom">课堂练习</button>
  <button data-tab="wrong">错题练习</button>
  <button data-tab="mine">我的记录</button>
</div>

<main>
  <!-- 考试 -->
  <section id="tab-exam">
    <div class="card" id="exam-list-card"><h2>可参加的考试 / 专题</h2><div id="exam-list"></div></div>
    <div class="card hidden" id="exam-do-card"><div id="exam-do"></div></div>
  </section>

  <!-- 课堂 -->
  <section id="tab-classroom" class="hidden">
    <div class="card" id="cr-join"><h2>加入课堂</h2>
      <label>课堂房间号</label><input id="cr-room" placeholder="教师提供的 4 位房间号">
      <div style="margin-top:12px"><button class="btn" onclick="joinRoom()">加入课堂</button></div>
      <div id="cr-msg" class="muted" style="margin-top:10px"></div>
    </div>
    <div class="card hidden" id="cr-live"><h2>课堂答题 <span class="tag" id="cr-live-id"></span></h2>
      <div id="cr-live-body" class="muted">等待教师发布题目…</div>
      <div id="cr-live-stats" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 错题练习 -->
  <section id="tab-wrong" class="hidden">
    <div class="card"><h2>错题练习</h2>
      <p class="muted">从你的错题库随机抽取题目演练，答对即视为掌握并自动移除。</p>
      <div style="margin-top:12px"><button class="btn" onclick="startPractice()">开始练习（全部错题）</button> <button class="btn ghost" onclick="startPractice(10)">抽取 10 题</button></div>
    </div>
    <div class="card hidden" id="wrong-do"><div id="wrong-do-body"></div></div>
  </section>

  <!-- 我的记录 -->
  <section id="tab-mine" class="hidden">
    <div class="card"><h2>我的答题记录</h2><div id="mine-body"></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="live hidden" id="live-dot">● 实时连接中</div>

<script>
const $=(s)=>document.querySelector(s);
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(()=>e.className='toast',2200);}
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const d=await r.json();if(d&&d._error)throw new Error(d.message);return d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- 身份 ----
let studentKey=localStorage.getItem('quiz_student_key')||'';
function showWho(){if(studentKey){$('#who-name').textContent=studentKey;$('#who').style.display='flex';}else{$('#who-name').textContent='未设置';}}
function editName(){const n=prompt('输入你的姓名或学号：',studentKey);if(n&&n.trim()){studentKey=n.trim();localStorage.setItem('quiz_student_key',studentKey);showWho();toast('身份已设置','ok');if(!$('#tab-exam').classList.contains('hidden'))loadExamList();}}
showWho();

// ---- Tab ----
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
  $('#tab-'+b.dataset.tab).classList.remove('hidden');
  if(b.dataset.tab==='exam')loadExamList();
  if(b.dataset.tab==='mine')loadMine();
});

// ---- 考试列表 ----
async function loadExamList(){
  if(!studentKey){$('#exam-list').innerHTML='<p class="muted">请先点击右上角「修改」设置你的姓名/学号。</p>';return;}
  try{const exams=await api('/api/exams');const box=$('#exam-list');
    if(!exams.length){box.innerHTML='<p class="muted">老师还没有发布考试。</p>';return;}
    box.innerHTML=exams.map(e=>`<div class="exam-card"><div class="info"><b>${esc(e.title)}</b><div class="meta">${(e.questionIds||[]).length} 题 · ${new Date(e.createdAt).toLocaleDateString()} · 不限时</div></div><button class="btn sm" onclick="enterExam('${e.id}')">开始答题</button></div>`).join('');
  }catch(e){toast(e.message,'err');}
}

// ---- 考试答题 ----
let examData=null,examAnswers={};
async function enterExam(id){
  try{examData=await api('/api/exams/'+id);examAnswers={};
    let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${esc(examData.title)}</h2><span class="muted">${examData.questions.length} 题</span></div><hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">`;
    examData.questions.forEach((q,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(q.title)}</div>`;
      q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickOpt('${q.id}',${j},this)">${j}. ${esc(o)}</div>`;});
      h+=`</div>`;
    });
    h+=`<div class="center" style="margin-top:16px"><button class="btn" onclick="submitExam('${id}')">交卷看成绩</button></div>`;
    $('#exam-do').innerHTML=h;$('#exam-list-card').classList.add('hidden');$('#exam-do-card').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickOpt(qid,j,el){examAnswers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitExam(id){
  const unanswered=examData.questions.filter(q=>examAnswers[q.id]===undefined).length;
  if(unanswered&&!confirm(`还有 ${unanswered} 题未作答，确认交卷？`))return;
  try{const r=await api('/api/exams/'+id+'/submit',{method:'POST',body:JSON.stringify({studentKey,studentName:studentKey,answers:examAnswers})});
    let h=`<div class="result-head"><div class="score">${r.score}分</div><div class="muted">答对 ${r.correct} / 共 ${r.total} 题${r.wrongAdded.length?` · 新增 ${r.wrongAdded.length} 道错题`:''}</div></div>`;
    r.details.forEach((d,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓ 正确</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗ 错误</span>'}</div>`;
      d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(j===d.selected&&!d.isCorrect)cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':(j===d.selected?'<span class="mk">✗</span>':'')}</div>`;});
      if(d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;
      h+=`</div>`;
    });
    h+=`<div class="center"><button class="btn ghost" onclick="backToExams()">返回考试列表</button></div>`;
    $('#exam-do').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function backToExams(){$('#exam-list-card').classList.remove('hidden');$('#exam-do-card').classList.add('hidden');loadExamList();loadMine();}

// ---- 课堂 ----
let crRoomId=null,crStudentId=null,crPollTimer=null,crAnswered={};
async function joinRoom(){
  const id=$('#cr-room').value.trim().toUpperCase();if(!id){toast('请输入房间号','err');return;}
  try{const d=await api('/api/join-room',{method:'POST',body:JSON.stringify({roomId:id,name:studentKey||'同学'})});
    crRoomId=id;crStudentId=d.studentId;$('#cr-join').classList.add('hidden');$('#cr-live').classList.remove('hidden');$('#cr-live-id').textContent=id;$('#live-dot').classList.remove('hidden');pollLoop();
  }catch(e){$('#cr-msg').textContent='加入失败：'+e.message;$('#cr-msg').className='err';}
}
async function pollLoop(){
  if(crPollTimer)clearInterval(crPollTimer);
  crPollTimer=setInterval(async()=>{
    try{const d=await api('/api/poll?roomId='+crRoomId+'&studentId='+crStudentId+'&for=student');
      if(d.type==='room-closed'){$('#cr-live-body').innerHTML='<p class="muted">课堂已结束。</p>';clearInterval(crPollTimer);$('#live-dot').classList.add('hidden');return;}
      renderLive(d);
    }catch(e){}
  },1500);
}
function renderLive(d){
  $('#cr-live-body').innerHTML='';
  if(d.state==='waiting'){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  if(!d.question){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  const q=d.question;
  let h=`<div class="q"><div class="qt">${esc(q.title)}</div>`;
  q.options.forEach((o,j)=>{
    let cls='opt';let mk='';
    if(d.state==='showing'&&d.question.correctAnswer===j){cls+=' correct';mk='<span class="mk">✓</span>';}
    if(crAnswered[q.index]===j&&d.state==='showing'&&d.question.correctAnswer!==j){cls+=' wrong';mk='<span class="mk">✗</span>';}
    h+=`<div class="${cls}" ${d.state==='answering'?`onclick="sendAnswer(${q.index},${j},this)"`:''}>${j}. ${esc(o)} ${mk}</div>`;
  });
  if(d.state==='answering')h+=`<div class="muted" style="margin-top:8px">点击选项作答，可修改。</div>`;
  if(d.state==='showing')h+=`<div class="ana">${d.question.correctAnswer>=0?('正确答案：'+d.question.options[d.question.correctAnswer]):''}</div>`;
  h+=`</div>`;
  $('#cr-live-body').innerHTML=h;
  // 统计
  if(d.stats){let s=`<div class="pill">已答 ${d.stats.answered}/${d.stats.totalStudents}</div>`;d.stats.counts.forEach((c,i)=>{if(d.question.options[i]!==undefined)s+=`<div class="pill">${d.question.options[i]}: ${d.stats.percentages[i]}%</div>`;});$('#cr-live-stats').innerHTML=s;}
}
async function sendAnswer(idx,j,el){
  if(crAnswered[idx]!==undefined){[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));}
  crAnswered[idx]=j;el.classList.add('sel');
  try{await api('/api/submit-answer',{method:'POST',body:JSON.stringify({roomId:crRoomId,studentId:crStudentId,answer:j})});}catch(e){toast(e.message,'err');}
}

// ---- 错题练习 ----
let wrongData=null,wrongAnswers={};
async function startPractice(count){
  if(!studentKey){toast('请先设置姓名/学号','err');return;}
  try{const d=await api('/api/wrong-practice/start',{method:'POST',body:JSON.stringify({studentKey,count})});
    if(!d.questions.length){toast('暂无错题，太棒了！','ok');return;}
    wrongData=d.questions;wrongAnswers={};
    let h=`<h2>错题练习（${d.questions.length} 题）</h2><hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">`;
    d.questions.forEach((q,i)=>{h+=`<div class="q" data-qid="${q.id}"><div class="qt">${i+1}. ${esc(q.title)} <span class="badge ${q.type}">${q.type==='judge'?'判断':'选择'}</span></div>`;q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickWrong('${q.id}',${j},this)">${j}. ${esc(o)}</div>`;});h+=`</div>`;});
    h+=`<div class="center" style="margin-top:16px"><button class="btn" onclick="submitPractice()">提交练习</button></div>`;
    $('#wrong-do-body').innerHTML=h;$('#wrong-do').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickWrong(qid,j,el){wrongAnswers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitPractice(){
  try{const r=await api('/api/wrong-practice/submit',{method:'POST',body:JSON.stringify({studentKey,answers:wrongAnswers})});
    let h=`<div class="result-head"><div class="score">${Math.round(r.correct/r.total*100)}分</div><div class="muted">答对 ${r.correct} / ${r.total} 题${r.removed.length?` · 已掌握移除 ${r.removed.length} 题`:''}</div></div>`;
    r.details.forEach((d,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗</span>'}</div>`;d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(j===d.selected&&!d.isCorrect)cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':(j===d.selected?'<span class="mk">✗</span>':'')}</div>`;});h+=`</div>`;});
    h+=`<div class="center"><button class="btn ghost" onclick="startPractice()">再练一次</button></div>`;
    $('#wrong-do-body').innerHTML=h;window.scrollTo(0,0);loadMine();
  }catch(e){toast(e.message,'err');}
}

// ---- 我的记录 ----
async function loadMine(){
  if(!studentKey){$('#mine-body').innerHTML='<p class="muted">请先设置姓名/学号。</p>';return;}
  try{const stats=await api('/api/students/'+encodeURIComponent(studentKey)+'/stats');
    const records=await api('/api/students/'+encodeURIComponent(studentKey)+'/records');
    let h=`<div class="stat-grid">
      <div class="stat-box"><div class="num">${stats.overall.percent}%</div><div class="lbl">总体正确率</div></div>
      <div class="stat-box"><div class="num">${stats.overall.correct}/${stats.overall.total}</div><div class="lbl">答对/总题</div></div>
      <div class="stat-box"><div class="num">${stats.examCount}</div><div class="lbl">考试次数</div></div>
      <div class="stat-box"><div class="num" style="color:var(--err)">${stats.wrongCount}</div><div class="lbl">待巩固错题</div></div></div>`;
    const topics=Object.keys(stats.byTopic);
    if(topics.length){h+='<h2 style="font-size:15px;margin:16px 0 8px">按专题正确率</h2><div class="stat-grid">';topics.forEach(t=>{const b=stats.byTopic[t];h+=`<div class="stat-box"><div class="num">${b.percent}%</div><div class="lbl">${esc(t)} (${b.correct}/${b.total})</div></div>`;});h+='</div>';}
    h+='<h2 style="font-size:15px;margin:16px 0 8px">历史记录</h2>';
    if(!records.length)h+='<p class="muted">暂无记录。</p>';
    records.forEach(r=>{h+=`<div class="exam-card"><div class="info"><b>${esc(r.refTitle)}</b><div class="meta">${new Date(r.date).toLocaleString()} · 得分 ${r.correct}/${r.total}</div></div></div>`;});
    $('#mine-body').innerHTML=h;
  }catch(e){toast(e.message,'err');}
}

// ---- URL 深链 ----
(function(){
  const h=location.hash;
  if(h.startsWith('#exam=')){const id=h.slice(6);if(studentKey){enterExam(id);document.querySelector('.nav button[data-tab=exam]').click();}else{toast('请先设置姓名/学号','err');}}
  else if(h.startsWith('#room=')){$('#cr-room').value=h.slice(6).toUpperCase();document.querySelector('.nav button[data-tab=classroom]').click();}
})();
</script>
</body>
</html>
