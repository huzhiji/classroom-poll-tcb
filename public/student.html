<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选调生学习系统 · 学生端</title>
<style>
  :root{--primary:#2563eb;--primary-d:#1d4ed8;--primary-l:#eef4ff;--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--ok:#16a34a;--err:#e11d48;--warn:#f59e0b;--shadow:0 6px 24px rgba(17,24,39,.07);--radius:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{background:linear-gradient(135deg,#0ea5e9,#4f46e5);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
  header h1{font-size:19px;font-weight:700}
  .who{font-size:13px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
  .who b{font-weight:700}
  .who button{background:rgba(255,255,255,.25);border:none;color:#fff;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:12px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1080px;margin:16px auto 0;padding:0 16px}
  .nav button{background:#fff;color:var(--primary);border:1px solid var(--border);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
  .nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  main{max-width:1080px;margin:16px auto;padding:0 16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .card h2{font-size:17px;margin-bottom:12px}
  .hidden{display:none!important}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  button.btn{background:var(--primary);color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;transition:.18s}
  button.btn:hover{background:var(--primary-d)}
  button.btn.ghost{background:#eef2ff;color:var(--primary)}
  button.btn.sm{padding:7px 14px;font-size:13px}
  button.btn.danger{background:var(--err)}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
  .exam-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
  .exam-card .info b{font-size:15px}.exam-card .info .meta{font-size:13px;color:var(--muted)}
  .q{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .q .qt{font-size:16px;font-weight:600;margin-bottom:10px}
  .opt{display:block;padding:12px 14px;border:2px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;font-size:15px;transition:.15s;background:#fff}
  .opt:hover{border-color:var(--primary)}
  .opt.sel{border-color:var(--primary);background:#eef2ff}
  .opt.correct{border-color:var(--ok);background:#dcfce7}
  .opt.wrong{border-color:var(--err);background:#fee2e2}
  .opt .mk{float:right;font-weight:700}
  .result-head{text-align:center;padding:18px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:12px;margin-bottom:16px}
  .result-head .score{font-size:40px;font-weight:800;color:var(--primary)}
  .ana{font-size:13px;color:var(--muted);margin-top:8px;padding:8px 10px;background:#fff;border-radius:8px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .stat-box{background:#f8fafc;border-radius:12px;padding:16px;text-align:center}
  .stat-box .num{font-size:26px;font-weight:700;color:var(--primary)}
  .stat-box .lbl{font-size:13px;color:var(--muted);margin-top:4px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.choice{background:#e0e7ff;color:var(--primary)}.badge.judge{background:#dcfce7;color:var(--ok)}
  .live{position:fixed;bottom:18px;right:18px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
  .pill{display:inline-flex;gap:6px;background:#f1f5f9;padding:5px 12px;border-radius:999px;font-size:13px;margin:4px}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:14px}
  #who-email{opacity:.85;font-size:12px;font-weight:400}
  /* 登录/注册弹窗 */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:200}
  .modal-box{background:#fff;border-radius:16px;padding:24px;width:min(380px,92vw);box-shadow:var(--shadow)}
  .modal-tabs{display:flex;gap:8px;margin-bottom:16px}
  .modal-tabs button{flex:1;padding:10px;border:1px solid var(--border);background:#fff;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
  .modal-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* ===== 选调生学习系统 · 新增组件样式 ===== */
  header h1 .logo{margin-right:4px}
  .hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow)}
  .hero h2{font-size:21px;font-weight:800}
  .hero .date{opacity:.92;font-size:14px;margin-top:4px}
  .hero-stat{background:rgba(255,255,255,.18);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
  .dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.2s}
  .dash-card:hover{box-shadow:0 10px 30px rgba(17,24,39,.12)}
  .dash-card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .dash-card .big{font-size:30px;font-weight:800;color:var(--primary);line-height:1.1}
  .dash-card .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .prog{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden;margin-top:8px}
  .prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#38bdf8);border-radius:999px;transition:.4s}
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
  .course-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(17,24,39,.14)}
  .course-card .ctop{height:60px;background:linear-gradient(135deg,var(--primary),#38bdf8);display:flex;align-items:center;justify-content:center;font-size:26px}
  .course-card .cbody{padding:14px}
  .course-card .ctitle{font-weight:700;font-size:15px;margin-bottom:6px}
  .course-card .cmeta{font-size:12px;color:var(--muted)}
  .lesson{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
  .lesson.done{border-color:var(--ok);background:#f0fdf4}
  .timeline{position:relative;padding-left:20px}
  .timeline:before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .tl-item{position:relative;margin-bottom:16px}
  .tl-item:before{content:'';position:absolute;left:-17px;top:5px;width:11px;height:11px;border-radius:50%;background:#cbd5e1;border:2px solid #fff;box-shadow:0 0 0 1px var(--border)}
  .tl-item.due:before{background:var(--warn);box-shadow:0 0 0 1px var(--warn)}
  .morning-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
  .morning-item.checked{border-color:var(--ok);background:#f0fdf4}
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
  .seg button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .tag{display:inline-block;font-size:11px;background:var(--primary-l);color:var(--primary);padding:2px 8px;border-radius:6px;font-weight:600;vertical-align:middle}
  @media(max-width:640px){.opt{padding:14px}}
  /* ===== 高级视觉升级：麦田沉浸式背景 + 玻璃拟态 ===== */
  body{
    background:
      linear-gradient(180deg, rgba(15,23,42,.34) 0%, rgba(15,23,42,.58) 100%),
      url('/images/bg-hero.jpg') center/cover no-repeat fixed;
    min-height:100vh;
  }
  header{
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 4px 30px rgba(0,0,0,.08);
  }
  header h1{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  header .logo{filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
  .who{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff}
  .who .muted{color:rgba(255,255,255,.82)}
  .who button{background:rgba(255,255,255,.28);transition:.2s}
  .who button:hover{background:rgba(255,255,255,.42)}
  .nav{max-width:1100px;padding:18px 16px 0}
  .nav button{
    background:rgba(255,255,255,.84);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.45);
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:.2s;
  }
  .nav button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .nav button.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(37,99,235,.35)}
  main{max-width:1100px;padding-bottom:40px}
  .card{
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 12px 40px rgba(15,23,42,.12);
  }
  .card h2{color:#1e293b}
  .hero{
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.25);
    padding:34px 32px;
    border-radius:20px;
  }
  .hero h2{font-size:28px;font-weight:800;letter-spacing:-.3px}
  .hero .date{opacity:.92;font-size:15px}
  .hero-stat{
    background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(8px);
    padding:12px 18px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
  }
  .dash-card{
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.6);
    border-radius:18px;
    transition:.25s;
  }
  .dash-card:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(15,23,42,.14)}
  .dash-card .big{font-size:32px}
  .modal{background:rgba(15,23,42,.62);backdrop-filter:blur(6px)}
  .modal-box{
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 28px 70px rgba(0,0,0,.28);
    border-radius:20px;
  }
  .modal-tabs button{background:rgba(241,245,249,.8);border:1px solid var(--border)}
  input,select,textarea{background:rgba(255,255,255,.96)}
  .result-head{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.55)}
  .stat-box{background:rgba(248,250,252,.88);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.45)}
  .q{background:rgba(248,250,252,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.52)}
  .opt{background:rgba(255,255,255,.82)}
  .exam-card{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.48)}
  .lesson,.morning-item{background:rgba(255,255,255,.8);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.45)}
  .morning-item.checked,.lesson.done{background:rgba(240,253,244,.88)}
  .live{background:rgba(30,41,59,.88);backdrop-filter:blur(8px)}
  .toast{background:rgba(30,41,59,.92);backdrop-filter:blur(8px)}
  .tag{background:rgba(239,246,255,.9)}
  .prog{background:rgba(226,232,240,.7)}
  @media(max-width:640px){
    header{padding:14px 16px}
    .hero{padding:24px 20px;border-radius:18px}
    .hero h2{font-size:22px}
    .nav button{padding:8px 14px;font-size:13px}
  }
  /* ===== 每日金句 ===== */
  @keyframes quoteCardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes quoteCardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .quote-card{
    position:relative;
    background:linear-gradient(135deg,rgba(17,24,39,.60),rgba(17,24,39,.40));
    backdrop-filter:blur(20px) saturate(1.25);
    -webkit-backdrop-filter:blur(20px) saturate(1.25);
    border:1px solid rgba(255,255,255,.14);
    border-left:3px solid rgba(212,175,55,.75);
    border-radius:22px;
    padding:32px 32px 22px;
    margin-bottom:22px;
    overflow:hidden;
    color:#f5efe1;
    box-shadow:0 26px 64px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset,0 0 54px rgba(212,175,55,.10);
    animation:quoteCardIn .85s cubic-bezier(.2,.7,.2,1) both,quoteCardFloat 7s ease-in-out 1s infinite;
  }
  .quote-card::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 90% at 50% -25%,rgba(255,255,255,.10),transparent 60%);
  }
  .quote-card .quote-mark{
    position:absolute;top:-26px;right:20px;
    font-size:130px;line-height:1;
    font-family:Georgia,"Times New Roman",serif;
    color:rgba(212,175,55,.20);
    pointer-events:none;
  }
  .quote-card .quote-text{
    font-size:23px;font-weight:700;color:#f7f2e4;
    line-height:1.55;letter-spacing:.4px;position:relative;
    text-shadow:0 1px 14px rgba(0,0,0,.35);
  }
  .quote-card .quote-foot{
    margin-top:18px;font-size:13px;color:rgba(245,239,225,.62);font-weight:600;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;
  }
  .quote-card .quote-foot .badge-q{
    background:linear-gradient(135deg,rgba(212,175,55,.28),rgba(212,175,55,.12));
    color:#f1da8c;border:1px solid rgba(212,175,55,.38);
    padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;
  }
  @media(max-width:640px){
    .quote-card{padding:26px 20px 18px;border-radius:18px}
    .quote-card .quote-text{font-size:19px}
    .quote-card .quote-mark{font-size:92px;top:-16px;right:12px}
  }
</style>
</head>
<body>
<!-- deploy-marker-20260811-1726 -->
<header>
  <h1><span class="logo">🎓</span> 选调生学习系统</h1>
  <div class="who" id="who">身份：<b id="who-name">未登录</b> <span id="who-email" class="muted"></span> <button onclick="openAuth()">登录/注册</button></div>
</header>

<div class="nav">
  <button data-tab="dashboard" class="active">📊 学习仪表盘</button>
  <button data-tab="courses">📚 课程</button>
  <button data-tab="exam">📝 考试答题</button>
  <button data-tab="morning">🌅 早读</button>
  <button data-tab="classroom">👥 课堂练习</button>
  <button data-tab="wrong">❌ 错题练习</button>
  <button data-tab="memory">🧠 记忆模式</button>
  <button data-tab="mine">📈 我的记录</button>
</div>

<main>
  <!-- 仪表盘（首页） -->
  <section id="tab-dashboard">
    <div id="dash-body"></div>
  </section>

  <!-- 课程 -->
  <section id="tab-courses" class="hidden">
    <div id="courses-body"></div>
  </section>

  <!-- 考试 -->
  <section id="tab-exam" class="hidden">
    <div class="card" id="exam-list-card"><h2>可参加的考试 / 专题</h2><div id="exam-list"></div></div>
    <div class="card hidden" id="exam-do-card"><div id="exam-do"></div></div>
  </section>

  <!-- 课堂 -->
  <section id="tab-classroom" class="hidden">
    <div class="card" id="cr-join"><h2>加入课堂</h2>
      <label>课堂房间号</label><input id="cr-room" placeholder="教师提供的 4 位房间号">
      <div style="margin-top:12px"><button class="btn" onclick="joinRoom()">加入课堂</button></div>
      <div id="cr-msg" class="muted" style="margin-top:10px"></div>
    </div>
    <div class="card hidden" id="cr-live"><h2>课堂答题 <span class="tag" id="cr-live-id"></span></h2>
      <div id="cr-live-body" class="muted">等待教师发布题目…</div>
      <div id="cr-live-stats" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 错题练习 -->
  <section id="tab-wrong" class="hidden">
    <div class="card"><h2>错题练习</h2>
      <p class="muted">从你的错题库随机抽取题目演练，答对即视为掌握并自动移除。</p>
      <div style="margin-top:12px"><button class="btn" onclick="startPractice()">开始练习（全部错题）</button> <button class="btn ghost" onclick="startPractice(10)">抽取 10 题</button></div>
    </div>
    <div class="card hidden" id="wrong-do"><div id="wrong-do-body"></div></div>
  </section>

  <!-- 记忆模式 -->
  <section id="tab-memory" class="hidden">
    <div class="card">
      <h2>记忆模式 <span class="badge" style="background:#e0e7ff;color:var(--primary)">艾宾浩斯</span></h2>
      <p class="muted">开启后，系统按遗忘规律自动安排每道题的复习时间，每天把该复习的题推给你，越记越牢（类似 Anki）。答错会自动缩短间隔、明天再来。</p>
      <div class="stat-grid" id="mem-stats" style="margin-top:12px">
        <div class="stat-box"><div class="num" id="mem-due" style="color:var(--err)">0</div><div class="lbl">今日待复习</div></div>
        <div class="stat-box"><div class="num" id="mem-learning">0</div><div class="lbl">学习中</div></div>
        <div class="stat-box"><div class="num" id="mem-mastered">0</div><div class="lbl">已掌握</div></div>
        <div class="stat-box"><div class="num" id="mem-total">0</div><div class="lbl">记忆卡总数</div></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="enableMemory('wrong')">＋ 把我的错题加入记忆</button>
        <button class="btn ghost sm" onclick="enableMemory('all')">＋ 把所有题目加入记忆</button>
        <button class="btn" id="mem-start" onclick="startMemory()">开始今日复习</button>
      </div>
      <p class="muted" style="margin-top:10px">提示：每天打开本页即自动显示「今日待复习」，按时复习即可。</p>
    </div>
    <div class="card hidden" id="mem-do"><div id="mem-do-body"></div></div>
  </section>

  <!-- 早读 -->
  <section id="tab-morning" class="hidden">
    <div id="morning-body"></div>
    <div class="card hidden" id="mr-do"><div id="mr-do-body"></div></div>
  </section>

  <!-- 我的记录 -->
  <section id="tab-mine" class="hidden">
    <div class="card"><h2>我的答题记录</h2><div id="mine-body"></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="live hidden" id="live-dot">● 实时连接中</div>

<!-- 登录 / 注册弹窗 -->
<div id="auth-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-tabs">
      <button data-auth="register" class="active" onclick="switchAuth('register')">注册</button>
      <button data-auth="login" onclick="switchAuth('login')">登录</button>
    </div>
    <div id="auth-register">
      <label>邮箱（用于接收复习提醒）</label>
      <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email">
      <label>姓名</label>
      <input id="reg-name" placeholder="你的姓名" autocomplete="name">
      <label>密码（至少 4 位）</label>
      <input id="reg-pw" type="password" placeholder="设置密码" autocomplete="new-password">
      <button class="btn" style="margin-top:14px;width:100%" onclick="doRegister()">注册并进入</button>
    </div>
    <div id="auth-login" class="hidden">
      <label>邮箱</label>
      <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
      <label>密码</label>
      <input id="login-pw" type="password" placeholder="输入密码" autocomplete="current-password">
      <button class="btn" style="margin-top:14px;width:100%" onclick="doLogin()">登录</button>
    </div>
    <div id="auth-msg" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<script src="/quotes.js"></script>
<script>
const $=(s)=>document.querySelector(s);
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(()=>e.className='toast',2200);}
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const d=await r.json();if(d&&d._error)throw new Error(d.message);return d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- 身份 / 注册登录 ----
let studentKey=localStorage.getItem('quiz_student_key')||'';
let studentName=localStorage.getItem('quiz_student_name')||'';
function showWho(){
  if(studentKey){$('#who-name').textContent=studentName||studentKey;$('#who-email').textContent=studentKey;$('#who').style.display='flex';}
  else{$('#who-name').textContent='未登录';$('#who-email').textContent='';}
}
function openAuth(){switchAuth('register');$('#auth-modal').classList.remove('hidden');$('#auth-msg').textContent='';}
function closeAuth(){$('#auth-modal').classList.add('hidden');}
function switchAuth(m){
  document.querySelectorAll('.modal-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.auth===m));
  $('#auth-register').classList.toggle('hidden',m!=='register');
  $('#auth-login').classList.toggle('hidden',m!=='login');
}
async function doRegister(){
  const email=$('#reg-email').value.trim(),name=$('#reg-name').value.trim(),pw=$('#reg-pw').value;
  if(!email||!name||!pw){$('#auth-msg').textContent='请填写完整信息';return;}
  try{
    const r=await api('/api/register',{method:'POST',body:JSON.stringify({email,name,password:pw})});
    studentKey=r.studentKey;studentName=r.name;
    localStorage.setItem('quiz_student_key',studentKey);localStorage.setItem('quiz_student_name',studentName);
    closeAuth();showWho();toast('注册成功，欢迎 '+studentName,'ok');loadExamList();
  }catch(e){$('#auth-msg').textContent=e.message;}
}
async function doLogin(){
  const email=$('#login-email').value.trim(),pw=$('#login-pw').value;
  if(!email||!pw){$('#auth-msg').textContent='请填写邮箱和密码';return;}
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({email,password:pw})});
    studentKey=r.studentKey;studentName=r.name;
    localStorage.setItem('quiz_student_key',studentKey);localStorage.setItem('quiz_student_name',studentName);
    closeAuth();showWho();toast('登录成功','ok');loadExamList();
  }catch(e){$('#auth-msg').textContent=e.message;}
}
showWho();
if(studentKey)loadDashboard();
if(!studentKey)openAuth();

// ---- Tab ----
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
  $('#tab-'+b.dataset.tab).classList.remove('hidden');
  if(b.dataset.tab==='dashboard')loadDashboard();
  if(b.dataset.tab==='courses')loadCourses();
  if(b.dataset.tab==='exam')loadExamList();
  if(b.dataset.tab==='mine')loadMine();
  if(b.dataset.tab==='memory')loadMemory();
  if(b.dataset.tab==='morning')loadMorning();
});

// ---- 考试列表 ----
async function loadExamList(){
  if(!studentKey){$('#exam-list').innerHTML='<p class="muted">请先点右上角「登录/注册」进入。</p>';return;}
  try{const exams=await api('/api/exams');const box=$('#exam-list');
    if(!exams.length){box.innerHTML='<p class="muted">老师还没有发布考试。</p>';return;}
    box.innerHTML=exams.map(e=>`<div class="exam-card"><div class="info"><b>${esc(e.title)}</b><div class="meta">${(e.questionIds||[]).length} 题 · ${new Date(e.createdAt).toLocaleDateString()} · 不限时</div></div><button class="btn sm" onclick="enterExam('${e.id}')">开始答题</button></div>`).join('');
  }catch(e){toast(e.message,'err');}
}

// ---- 考试答题 ----
let examData=null,examAnswers={};
async function enterExam(id){
  try{examData=await api('/api/exams/'+id);examAnswers={};
    let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${esc(examData.title)}</h2><span class="muted">${examData.questions.length} 题</span></div><hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">`;
    examData.questions.forEach((q,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(q.title)}</div>`;
      q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickOpt('${q.id}',${j},this)">${j}. ${esc(o)}</div>`;});
      h+=`</div>`;
    });
    h+=`<div class="center" style="margin-top:16px"><button class="btn" onclick="submitExam('${id}')">交卷看成绩</button></div>`;
    $('#exam-do').innerHTML=h;$('#exam-list-card').classList.add('hidden');$('#exam-do-card').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickOpt(qid,j,el){examAnswers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitExam(id){
  const unanswered=examData.questions.filter(q=>examAnswers[q.id]===undefined).length;
  if(unanswered&&!confirm(`还有 ${unanswered} 题未作答，确认交卷？`))return;
  try{const r=await api('/api/exams/'+id+'/submit',{method:'POST',body:JSON.stringify({studentKey,studentName:studentKey,answers:examAnswers})});
    let h=`<div class="result-head"><div class="score">${r.score}分</div><div class="muted">答对 ${r.correct} / 共 ${r.total} 题${r.wrongAdded.length?` · 新增 ${r.wrongAdded.length} 道错题`:''}</div></div>`;
    r.details.forEach((d,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓ 正确</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗ 错误</span>'}</div>`;
      d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(j===d.selected&&!d.isCorrect)cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':(j===d.selected?'<span class="mk">✗</span>':'')}</div>`;});
      if(d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;
      h+=`</div>`;
    });
    h+=`<div class="center"><button class="btn ghost" onclick="backToExams()">返回考试列表</button></div>`;
    $('#exam-do').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function backToExams(){$('#exam-list-card').classList.remove('hidden');$('#exam-do-card').classList.add('hidden');loadExamList();loadMine();}

// ---- 课堂 ----
let crRoomId=null,crStudentId=null,crPollTimer=null,crAnswered={};
async function joinRoom(){
  const id=$('#cr-room').value.trim().toUpperCase();if(!id){toast('请输入房间号','err');return;}
  try{const d=await api('/api/join-room',{method:'POST',body:JSON.stringify({roomId:id,name:studentKey||'同学'})});
    crRoomId=id;crStudentId=d.studentId;$('#cr-join').classList.add('hidden');$('#cr-live').classList.remove('hidden');$('#cr-live-id').textContent=id;$('#live-dot').classList.remove('hidden');pollLoop();
  }catch(e){$('#cr-msg').textContent='加入失败：'+e.message;$('#cr-msg').className='err';}
}
async function pollLoop(){
  if(crPollTimer)clearInterval(crPollTimer);
  crPollTimer=setInterval(async()=>{
    try{const d=await api('/api/poll?roomId='+crRoomId+'&studentId='+crStudentId+'&for=student');
      if(d.type==='room-closed'){$('#cr-live-body').innerHTML='<p class="muted">课堂已结束。</p>';clearInterval(crPollTimer);$('#live-dot').classList.add('hidden');return;}
      renderLive(d);
    }catch(e){}
  },1500);
}
function renderLive(d){
  $('#cr-live-body').innerHTML='';
  if(d.state==='waiting'){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  if(!d.question){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  const q=d.question;
  let h=`<div class="q"><div class="qt">${esc(q.title)}</div>`;
  q.options.forEach((o,j)=>{
    let cls='opt';let mk='';
    if(d.state==='showing'&&d.question.correctAnswer===j){cls+=' correct';mk='<span class="mk">✓</span>';}
    if(crAnswered[q.index]===j&&d.state==='showing'&&d.question.correctAnswer!==j){cls+=' wrong';mk='<span class="mk">✗</span>';}
    h+=`<div class="${cls}" ${d.state==='answering'?`onclick="sendAnswer(${q.index},${j},this)"`:''}>${j}. ${esc(o)} ${mk}</div>`;
  });
  if(d.state==='answering')h+=`<div class="muted" style="margin-top:8px">点击选项作答，可修改。</div>`;
  if(d.state==='showing')h+=`<div class="ana">${d.question.correctAnswer>=0?('正确答案：'+d.question.options[d.question.correctAnswer]):''}</div>`;
  h+=`</div>`;
  $('#cr-live-body').innerHTML=h;
  // 统计
  if(d.stats){let s=`<div class="pill">已答 ${d.stats.answered}/${d.stats.totalStudents}</div>`;d.stats.counts.forEach((c,i)=>{if(d.question.options[i]!==undefined)s+=`<div class="pill">${d.question.options[i]}: ${d.stats.percentages[i]}%</div>`;});$('#cr-live-stats').innerHTML=s;}
}
async function sendAnswer(idx,j,el){
  if(crAnswered[idx]!==undefined){[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));}
  crAnswered[idx]=j;el.classList.add('sel');
  try{await api('/api/submit-answer',{method:'POST',body:JSON.stringify({roomId:crRoomId,studentId:crStudentId,answer:j})});}catch(e){toast(e.message,'err');}
}

// ---- 错题练习 ----
let wrongData=null,wrongAnswers={};
async function startPractice(count){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{const d=await api('/api/wrong-practice/start',{method:'POST',body:JSON.stringify({studentKey,count})});
    if(!d.questions.length){toast('暂无错题，太棒了！','ok');return;}
    wrongData=d.questions;wrongAnswers={};
    let h=`<h2>错题练习（${d.questions.length} 题）</h2><hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">`;
    d.questions.forEach((q,i)=>{h+=`<div class="q" data-qid="${q.id}"><div class="qt">${i+1}. ${esc(q.title)} <span class="badge ${q.type}">${q.type==='judge'?'判断':'选择'}</span></div>`;q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickWrong('${q.id}',${j},this)">${j}. ${esc(o)}</div>`;});h+=`</div>`;});
    h+=`<div class="center" style="margin-top:16px"><button class="btn" onclick="submitPractice()">提交练习</button></div>`;
    $('#wrong-do-body').innerHTML=h;$('#wrong-do').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickWrong(qid,j,el){wrongAnswers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitPractice(){
  try{const r=await api('/api/wrong-practice/submit',{method:'POST',body:JSON.stringify({studentKey,answers:wrongAnswers})});
    let h=`<div class="result-head"><div class="score">${Math.round(r.correct/r.total*100)}分</div><div class="muted">答对 ${r.correct} / ${r.total} 题${r.removed.length?` · 已掌握移除 ${r.removed.length} 题`:''}</div></div>`;
    r.details.forEach((d,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗</span>'}</div>`;d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(j===d.selected&&!d.isCorrect)cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':(j===d.selected?'<span class="mk">✗</span>':'')}</div>`;});h+=`</div>`;});
    h+=`<div class="center"><button class="btn ghost" onclick="startPractice()">再练一次</button></div>`;
    $('#wrong-do-body').innerHTML=h;window.scrollTo(0,0);loadMine();
  }catch(e){toast(e.message,'err');}
}

// ---- 记忆模式（SRS） ----
let memData=null,memAnswers={};
async function loadMemory(){
  if(!studentKey){$('#mem-stats').innerHTML='<p class="muted">请先登录/注册。</p>';return;}
  try{
    const d=await api('/api/memory/due?key='+encodeURIComponent(studentKey));
    $('#mem-due').textContent=d.stats.due;
    $('#mem-learning').textContent=d.stats.learning;
    $('#mem-mastered').textContent=d.stats.mastered;
    $('#mem-total').textContent=d.stats.total;
    $('#mem-start').textContent='开始今日复习'+(d.stats.due?`（${d.stats.due}）`:'');
    $('#mem-start').style.opacity=d.stats.due?'1':'.5';
  }catch(e){toast(e.message,'err');}
}
async function enableMemory(source){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{
    let qids=[];
    if(source==='wrong'){const list=await api('/api/students/'+encodeURIComponent(studentKey)+'/wrong');qids=list.map(q=>q.id);}
    else{const list=await api('/api/questions');qids=list.map(q=>q.id);}
    if(!qids.length){toast('没有可加入的题目','err');return;}
    const d=await api('/api/memory/enable',{method:'POST',body:JSON.stringify({studentKey,qids})});
    toast('已加入记忆计划：新增 '+d.added+' 张卡','ok');
    loadMemory();
  }catch(e){toast(e.message,'err');}
}
async function startMemory(){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{
    const d=await api('/api/memory/due?key='+encodeURIComponent(studentKey));
    if(!d.questions.length){toast('今日没有待复习的题目 🎉','ok');return;}
    memData=d.questions;memAnswers={};
    let h=`<h2>今日复习（${d.questions.length} 题）</h2><hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">`;
    memData.forEach((q,i)=>{h+=`<div class="q" data-qid="${q.qid}"><div class="qt">${i+1}. ${esc(q.title)} <span class="badge ${q.type}">${q.type==='judge'?'判断':'选择'}</span></div>`;q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickMem('${q.qid}',${j},this)">${j}. ${esc(o)}</div>`;});h+=`</div>`;});
    h+=`<div class="center" style="margin-top:16px"><button class="btn" onclick="submitMemory()">提交复习</button></div>`;
    $('#mem-do-body').innerHTML=h;$('#mem-do').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickMem(qid,j,el){memAnswers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitMemory(){
  try{
    const r=await api('/api/memory/review',{method:'POST',body:JSON.stringify({studentKey,answers:memAnswers})});
    const correct=r.results.filter(x=>x.isCorrect).length;
    let h=`<div class="result-head"><div class="score">${Math.round(correct/r.results.length*100)}分</div><div class="muted">本次复习 ${r.results.length} 题</div></div>`;
    r.results.forEach((d,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓ 已记住</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗ 再记一次</span>'}</div>`;
      d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(!d.isCorrect&&j===memAnswers[d.qid])cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':''}</div>`;});
      h+=`<div class="ana">下次复习：约 <b>${d.nextIntervalDays}</b> 天后${d.isCorrect?'（已记住，间隔拉长）':'（未记住，明天再来）'}</div>`;
      if(d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;
      h+=`</div>`;
    });
    h+=`<div class="center"><button class="btn ghost" onclick="afterMemory()">返回</button></div>`;
    $('#mem-do-body').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
async function afterMemory(){$('#mem-do').classList.add('hidden');loadMemory();loadMine();}

// ---- 我的记录 ----
async function loadMine(){
  if(!studentKey){$('#mine-body').innerHTML='<p class="muted">请先登录/注册。</p>';return;}
  try{const stats=await api('/api/students/'+encodeURIComponent(studentKey)+'/stats');
    const records=await api('/api/students/'+encodeURIComponent(studentKey)+'/records');
    let h=`<div class="stat-grid">
      <div class="stat-box"><div class="num">${stats.overall.percent}%</div><div class="lbl">总体正确率</div></div>
      <div class="stat-box"><div class="num">${stats.overall.correct}/${stats.overall.total}</div><div class="lbl">答对/总题</div></div>
      <div class="stat-box"><div class="num">${stats.examCount}</div><div class="lbl">考试次数</div></div>
      <div class="stat-box"><div class="num" style="color:var(--err)">${stats.wrongCount}</div><div class="lbl">待巩固错题</div></div></div>`;
    const topics=Object.keys(stats.byTopic);
    if(topics.length){h+='<h2 style="font-size:15px;margin:16px 0 8px">按专题正确率</h2><div class="stat-grid">';topics.forEach(t=>{const b=stats.byTopic[t];h+=`<div class="stat-box"><div class="num">${b.percent}%</div><div class="lbl">${esc(t)} (${b.correct}/${b.total})</div></div>`;});h+='</div>';}
    h+='<h2 style="font-size:15px;margin:16px 0 8px">历史记录</h2>';
    if(!records.length)h+='<p class="muted">暂无记录。</p>';
    records.forEach(r=>{h+=`<div class="exam-card"><div class="info"><b>${esc(r.refTitle)}</b><div class="meta">${new Date(r.date).toLocaleString()} · 得分 ${r.correct}/${r.total}</div></div></div>`;});
    $('#mine-body').innerHTML=h;
  }catch(e){toast(e.message,'err');}
}

// ---- 仪表盘 ----
let morningToday=null, mrData=null, mrAnswers={}, curDoneSet=new Set(), hwState=null;
async function loadDashboard(){
  if(!studentKey){
    $('#dash-body').innerHTML=quoteCardHTML()+`<div class="hero" style="text-align:center;padding:56px 24px;margin-top:8vh">
      <div style="font-size:48px;margin-bottom:14px">🌾</div>
      <h2 style="font-size:32px">选调生学习系统</h2>
      <p style="opacity:.9;font-size:16px;margin:12px 0 24px">扎根基层 · 勤学善思 · 乡村振兴</p>
      <button class="btn" style="padding:14px 32px;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.2)" onclick="openAuth()">登录 / 注册</button>
    </div>`;
    return;
  }
  try{
    const d=await api('/api/dashboard/student?key='+encodeURIComponent(studentKey));
    let h=quoteCardHTML()+`<div class="hero"><div><h2>你好，${esc(studentName||studentKey)} 👋</h2><div class="date">${new Date().toLocaleDateString('zh-CN')} · 选调生备考进度看板</div></div><div class="hero-stat">今日早读：${d.morning.done?'已打卡 ✅':(d.morning.pending?('待打卡 '+d.morning.pending+' 项'):'暂无任务')}</div></div>`;
    h+='<div class="dash-grid">';
    h+=dashTile('课程总进度',d.courses.avgPercent+'%',d.courses.completedLessons+'/'+d.courses.totalLessons+' 课时');
    h+=dashTile('答题正确率',d.quiz.percent+'%',d.quiz.correct+'/'+d.quiz.total+' 题');
    h+=dashTile('记忆掌握',d.mastery.mastered,'已掌握卡片');
    h+=dashTile('待巩固错题',d.wrong,'需复习');
    h+=dashTile('今日早读',d.morning.done?'已完成':(d.morning.pending?'待打卡':'无'),d.morning.total+' 项');
    h+='</div>';
    h+='<div class="card" style="margin-top:18px"><h2>📚 课程学习进度</h2>';
    if(!d.courses.list.length){h+='<p class="muted">还没有课程，去「课程」页查看。</p>';}
    else{d.courses.list.forEach(c=>{h+=`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${esc(c.title)}</b><span class="muted">${c.completed}/${c.total} 课时 · ${c.percent}%</span></div><div class="prog"><span style="width:${c.percent}%"></span></div></div>`;});}
    h+='</div>';
    h+='<div class="card" style="margin-top:18px"><h2>🌅 今日早读</h2>';
    if(!d.morning.items.length){h+='<p class="muted">老师尚未推送早读，也没有自建早读。</p>';}
    else{h+=`<p class="muted">${d.morning.done?'你已完成今日早读打卡 🎉':'请完成早读打卡（每日必做）'}</p><button class="btn" onclick="goMorning()">${d.morning.done?'查看早读':'去早读打卡'}</button>`;}
    h+='</div>';
    h+='<div class="card" style="margin-top:18px"><h2>⚠️ 薄弱环节（专题正确率偏低）</h2>';
    if(!d.weak.length){h+='<p class="muted">答题数据不足，多做几套题即可看到薄弱点。</p>';}
    else{d.weak.forEach(w=>{h+=`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${esc(w.topic)}</b><span class="muted" style="color:var(--err)">${w.percent}%</span></div><div class="prog"><span style="width:${w.percent}%;background:linear-gradient(90deg,#f59e0b,#e11d48)"></span></div></div>`;});}
    h+='</div>';
    $('#dash-body').innerHTML=h;
  }catch(e){toast(e.message,'err');}
}
function dashTile(t,n,sub){return `<div class="dash-card"><h3>${t}</h3><div class="big">${n}</div><div class="sub">${sub}</div></div>`;}
function quoteCardHTML(){
  const q=getDailyQuote();
  const ds=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  return `<div class="quote-card">
    <div class="quote-mark">“</div>
    <div class="quote-text">${esc(q.text)}</div>
    <div class="quote-foot"><span class="badge-q">📜 总书记金句</span> ${ds} · 来源：${esc(q.source)}</div>
  </div>`;
}
function goMorning(){document.querySelector('.nav button[data-tab=morning]').click();}

// ---- 课程 ----
async function loadCourses(){
  if(!studentKey){$('#courses-body').innerHTML='<p class="muted">请先登录/注册。</p>';return;}
  try{
    const list=await api('/api/student/courses?key='+encodeURIComponent(studentKey));
    const box=$('#courses-body');
    if(!list.length){box.innerHTML='<p class="muted">老师还没有发布课程。</p>';return;}
    box.innerHTML='<div class="course-grid">'+list.map(c=>`<div class="course-card" onclick="openCourse('${c.id}')"><div class="ctop">📘</div><div class="cbody"><div class="ctitle">${esc(c.title)}</div><div class="cmeta">${c.chapterCount} 章 · ${c.total} 课时</div><div class="prog" style="margin-top:8px"><span style="width:${c.percent}%"></span></div><div class="cmeta" style="margin-top:6px">进度 ${c.completed}/${c.total}（${c.percent}%）</div></div></div>`).join('')+'</div>';
  }catch(e){toast(e.message,'err');}
}
async function openCourse(id){
  try{
    const c=await api('/api/courses/'+id);
    const p=await api('/api/courses/'+id+'/progress?key='+encodeURIComponent(studentKey));
    curDoneSet=new Set(p.completedLessons||[]);
    let h=`<button class="btn ghost sm" onclick="loadCourses()">← 返回课程列表</button><h2 style="margin:12px 0">${esc(c.title)}</h2>`;
    if(c.description)h+=`<p class="muted">${esc(c.description)}</p>`;
    h+=`<div class="prog" style="margin:10px 0"><span style="width:${p.percent}%"></span></div><p class="muted">${p.completed}/${p.total} 课时完成（${p.percent}%）</p>`;
    if(!c.chapters.length){h+='<p class="muted">本课程暂无章节内容。</p>';}
    c.chapters.forEach(ch=>{
      h+=`<div class="card" style="margin-top:14px"><h2 style="font-size:15px">📂 ${esc(ch.title)}</h2>`;
      if(!ch.lessons.length){h+='<p class="muted">本章暂无课时。</p>';}
      ch.lessons.forEach(ls=>{
        const done=curDoneSet.has(ls.id);
        h+=`<div class="lesson ${done?'done':''}"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(ls.title)}</b> ${ls.type==='material'?'<span class="tag">资料</span>':''}</div>`;
        if(ls.content)h+=`<div class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(ls.content)}</div>`;
        if(ls.materials&&ls.materials.length){h+='<div style="margin-top:6px">'+ls.materials.map(m=>`<a class="pill" href="${esc(m.url)}" target="_blank" rel="noopener">🔗 ${esc(m.title||m.url)}</a>`).join('')+'</div>';}
        if(ls.practiceExamId)h+=`<div style="margin-top:8px"><button class="btn ghost sm" onclick="enterExam('${ls.practiceExamId}')">▶ 完成内置练习</button></div>`;
        h+=`<div style="margin-top:10px"><button class="btn sm ${done?'ghost':''}" id="lsbtn-${ls.id}" onclick="toggleLesson('${id}','${ls.id}',${done})">${done?'✓ 已完成（点击取消）':'标记完成'}</button></div>`;
        h+='</div>';
      });
      h+='</div>';
    });
    $('#courses-body').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
async function toggleLesson(cid,lsid,done){
  try{await api('/api/courses/'+cid+'/lessons/'+lsid+'/done',{method:'POST',body:JSON.stringify({studentKey,done:!done})});
    if(done)curDoneSet.delete(lsid);else curDoneSet.add(lsid);
    const btn=$('#lsbtn-'+lsid);const card=btn.closest('.lesson');
    if(done){btn.textContent='标记完成';btn.classList.remove('ghost');card.classList.remove('done');}
    else{btn.textContent='✓ 已完成（点击取消）';btn.classList.add('ghost');card.classList.add('done');}
    toast(done?'已取消完成':'已标记完成','ok');loadDashboard();
  }catch(e){toast(e.message,'err');}
}

// ---- 早读 ----
async function loadMorning(){
  if(!studentKey){$('#morning-body').innerHTML='<p class="muted">请先登录/注册。</p>';return;}
  const today=new Date().toISOString().slice(0,10);
  try{
    const t=await api('/api/morning/today?key='+encodeURIComponent(studentKey)+'&date='+today);
    const own=await api('/api/morning?ownerKey='+encodeURIComponent(studentKey)+'&scope=student');
    const mr=await api('/api/morning/memory/stats?key='+encodeURIComponent(studentKey));
    const hw=await api('/api/morning/homework?date='+today);
    morningToday=t;
    let h='<div class="card"><h2>🌅 今日早读打卡 <span class="tag">'+today+'</span></h2>';
    if(!t.items.length){h+='<p class="muted">老师尚未推送早读，也没有自建早读。可在下方「我的早读规划」自建。</p>';}
    else{
      h+=`<p class="muted">${t.checkin.done?'✅ 今日已打卡':'请阅读下列内容后完成打卡（每日必做）'}</p><div id="morning-items">`;
      t.items.forEach(m=>{const chk=t.checkin.readingIds.includes(m.id);h+=`<div class="morning-item ${chk?'checked':''}"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" class="mchk" value="${m.id}" ${chk?'checked':''} style="margin-top:5px"><div><div style="font-weight:600">${esc(m.title)}</div><div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(m.content||'')}</div></div></label></div>`;});
      h+='</div>';
      h+=`<div class="btnrow"><button class="btn" onclick="doCheckin()">${t.checkin.done?'取消打卡':'完成今日打卡'}</button></div>`;
      if(hw.length){h+='<hr style="margin:16px 0;border:none;border-top:1px solid var(--border)"><h2 style="font-size:15px">📋 今日早读作业</h2>';hw.forEach(hh=>{h+=`<div class="lesson"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(hh.title)}</b><button class="btn ghost sm" onclick="doHomework('${hh.id}')">去完成</button></div><div class="muted" style="margin-top:4px">${hh.questionIds.length} 题${hh.examId?'（来自考试）':''}</div></div>`;});}
    }
    h+='</div>';
    h+='<div class="card" style="margin-top:18px"><h2>🧠 早读记忆复习 <span class="tag">艾宾浩斯</span></h2>';
    h+=`<div class="stat-grid" style="margin-top:8px"><div class="stat-box"><div class="num" style="color:var(--err)">${mr.due}</div><div class="lbl">今日待复习</div></div><div class="stat-box"><div class="num">${mr.learning}</div><div class="lbl">学习中</div></div><div class="stat-box"><div class="num">${mr.mastered}</div><div class="lbl">已掌握</div></div><div class="stat-box"><div class="num">${mr.total}</div><div class="lbl">记忆卡</div></div></div>`;
    h+='<p class="muted" style="margin-top:8px">把已打卡的早读加入记忆后，系统按遗忘曲线自动安排复习。</p>';
    h+=`<div class="btnrow"><button class="btn ghost sm" onclick="enableMr()">＋ 把今日早读加入记忆</button><button class="btn" id="mr-start" onclick="startMr()" ${mr.due?'':'disabled'}>开始今日复习</button></div>`;
    h+='</div>';
    h+='<div class="card" style="margin-top:18px"><h2>🗓️ 我的早读规划（自建）</h2><div class="row"><div style="flex:2"><label>标题</label><input id="mr-title" placeholder="如：背诵习近平金句 10 条"></div></div><label>内容</label><textarea id="mr-content" placeholder="早读文本 / 知识点…"></textarea><div class="btnrow"><button class="btn" onclick="addMyMorning()">添加我的早读</button></div><div id="my-morning-list" style="margin-top:12px"></div></div>';
    h+='<div class="card" style="margin-top:18px"><h2>📅 早读复习日程表</h2><div id="mr-schedule"></div></div>';
    $('#morning-body').innerHTML=h;
    renderMyMorning(own);renderSchedule();
  }catch(e){toast(e.message,'err');}
}
function toggleIds(){const all=[...document.querySelectorAll('.mchk')].map(c=>c.value);const checked=[...document.querySelectorAll('.mchk:checked')].map(c=>c.value);return checked.length?checked:all;}
async function doCheckin(){
  const ids=toggleIds();const willDone=!(morningToday&&morningToday.checkin.done);
  try{await api('/api/morning/checkin',{method:'POST',body:JSON.stringify({studentKey,date:new Date().toISOString().slice(0,10),readingIds:ids,done:willDone})});toast(willDone?'打卡成功':'已取消打卡','ok');loadMorning();loadDashboard();}catch(e){toast(e.message,'err');}
}
async function addMyMorning(){const title=$('#mr-title').value.trim(),content=$('#mr-content').value.trim();if(!title){toast('请填写标题','err');return;}try{await api('/api/morning',{method:'POST',body:JSON.stringify({ownerType:'student',ownerKey:studentKey,title,content})});toast('已添加','ok');$('#mr-title').value='';$('#mr-content').value='';loadMorning();}catch(e){toast(e.message,'err');}}
function renderMyMorning(own){const box=$('#my-morning-list');if(!own||!own.length){box.innerHTML='<p class="muted">还没有自建早读。</p>';return;}box.innerHTML=own.map(m=>`<div class="morning-item"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(m.title)}</b><button class="btn danger sm" onclick="delMyMorning('${m.id}')">删除</button></div><div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(m.content||'')}</div></div>`).join('');}
async function delMyMorning(id){if(!confirm('删除该早读？'))return;try{await api('/api/morning/'+id,{method:'DELETE'});toast('已删除','ok');loadMorning();}catch(e){toast(e.message,'err');}}
async function enableMr(){if(!morningToday||!morningToday.items.length){toast('今日没有可加入的早读','err');return;}const ids=morningToday.items.map(m=>m.id);try{const r=await api('/api/morning/memory/enable',{method:'POST',body:JSON.stringify({studentKey,mrids:ids})});toast('已加入记忆：'+r.added+' 张卡','ok');loadMorning();}catch(e){toast(e.message,'err');}}
async function startMr(){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{const d=await api('/api/morning/memory/due?key='+encodeURIComponent(studentKey));
    if(!d.items.length){toast('今日没有待复习的早读 🎉','ok');return;}
    mrData=d.items;mrAnswers={};
    let h=`<h2>早读复习（${d.items.length} 项）</h2><hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">`;
    d.items.forEach((m,i)=>{h+=`<div class="q" data-mrid="${m.itemId}"><div class="qt">${i+1}. ${esc(m.title)}</div><div class="muted" style="white-space:pre-wrap;margin-bottom:8px">${esc(m.content||'')}</div><div class="opt" onclick="pickMr('${m.itemId}',0,this)">✅ 记住了</div><div class="opt" onclick="pickMr('${m.itemId}',1,this)">❌ 没记住</div></div>`;});
    h+=`<div class="center" style="margin-top:14px"><button class="btn" onclick="submitMr()">提交复习</button></div>`;
    $('#mr-do-body').innerHTML=h;$('#mr-do').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickMr(mrid,v,el){mrAnswers[mrid]=v;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitMr(){try{const r=await api('/api/morning/memory/review',{method:'POST',body:JSON.stringify({studentKey,results:mrAnswers})});let ok=r.results.filter(x=>x.isCorrect).length;let h=`<div class="result-head"><div class="score">${Math.round(ok/r.results.length*100)}分</div><div class="muted">本次复习 ${r.results.length} 项</div></div>`;r.results.forEach((x,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(x.title)} ${x.isCorrect?'<span class="badge judge">✓ 已记住</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗ 再记一次</span>'}</div><div class="ana">下次复习：约 <b>${x.nextIntervalDays}</b> 天后（${x.isCorrect?'间隔拉长':'明天再来'}）</div></div>`;});h+=`<div class="center"><button class="btn ghost" onclick="afterMr()">返回</button></div>`;$('#mr-do-body').innerHTML=h;window.scrollTo(0,0);}catch(e){toast(e.message,'err');}}
async function afterMr(){$('#mr-do').classList.add('hidden');loadMorning();loadDashboard();}
async function renderSchedule(){
  try{
    const cards=await api('/api/morning/memory/cards?key='+encodeURIComponent(studentKey));
    const buckets={};cards.forEach(c=>{const day=new Date(c.due).toISOString().slice(0,10);(buckets[day]=buckets[day]||[]).push(c);});
    let h='<div class="timeline">';const today=new Date();
    for(let i=0;i<14;i++){const dt=new Date(today);dt.setDate(today.getDate()+i);const day=dt.toISOString().slice(0,10);const items=buckets[day]||[];
      h+=`<div class="tl-item ${items.length?'due':''}"><div><b>${day}${i===0?'（今天）':i===1?'（明天）':''}</b> — ${items.length?items.length+' 项待复习':'无安排'}</div>${items.slice(0,3).map(it=>'<div class="muted">· '+esc(it.title)+'</div>').join('')}</div>`;}
    h+='</div><p class="muted">系统按艾宾浩斯遗忘曲线自动安排每日复习，越记越牢。</p>';
    $('#mr-schedule').innerHTML=h;
  }catch(e){}
}
async function doHomework(id){
  try{
    const list=await api('/api/morning/homework?date='+new Date().toISOString().slice(0,10));
    const hh=list.find(x=>x.id===id);if(!hh)throw new Error('作业不存在');
    let qids=hh.questionIds||[];if(!qids.length&&hh.examId){const e=await api('/api/exams/'+hh.examId);qids=e.questionIds||[];}
    const allq=await api('/api/questions');const map={};allq.forEach(q=>map[q.id]=q);
    const qs=qids.map(qid=>map[qid]).filter(Boolean);
    if(!qs.length){toast('作业暂无可答题','err');return;}
    hwState={id,answers:{}};
    let h=`<button class="btn ghost sm" onclick="loadMorning()">← 返回早读</button><h2 style="margin:12px 0">📋 ${esc(hh.title)}</h2><hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">`;
    qs.forEach((q,i)=>{h+=`<div class="q" data-qid="${q.id}"><div class="qt">${i+1}. ${esc(q.title)}</div>`;q.options.forEach((o,j)=>{h+=`<div class="opt" onclick="pickHw('${q.id}',${j},this)">${j}. ${esc(o)}</div>`;});h+=`</div>`;});
    h+=`<div class="center" style="margin-top:14px"><button class="btn" onclick="submitHw()">提交作业</button></div>`;
    $('#morning-body').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickHw(qid,j,el){hwState.answers[qid]=j;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitHw(){
  try{const r=await api('/api/morning/homework/'+hwState.id+'/submit',{method:'POST',body:JSON.stringify({studentKey,studentName:studentKey,answers:hwState.answers})});
    let h=`<div class="result-head"><div class="score">${r.score}分</div><div class="muted">答对 ${r.correct} / ${r.total} 题</div></div>`;
    r.details.forEach((d,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓</span>':'<span class="badge choice" style="background:#fee2e2;color:var(--err)">✗</span>'}</div>`;d.options.forEach((o,j)=>{let cls='opt';if(j===d.correctAnswer)cls+=' correct';else if(j===d.selected&&!d.isCorrect)cls+=' wrong';h+=`<div class="${cls}">${j}. ${esc(o)} ${j===d.correctAnswer?'<span class="mk">✓</span>':(j===d.selected?'<span class="mk">✗</span>':'')}</div>`;});if(d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;h+=`</div>`;});
    h+=`<div class="center"><button class="btn ghost" onclick="loadMorning()">返回早读</button></div>`;
    $('#morning-body').innerHTML=h;window.scrollTo(0,0);loadDashboard();
  }catch(e){toast(e.message,'err');}
}

// ---- URL 深链 ----
(function(){
  const h=location.hash;
  if(h.startsWith('#exam=')){const id=h.slice(6);if(studentKey){enterExam(id);document.querySelector('.nav button[data-tab=exam]').click();}else{toast('请先登录/注册','err');openAuth();}}
  else if(h.startsWith('#room=')){$('#cr-room').value=h.slice(6).toUpperCase();document.querySelector('.nav button[data-tab=classroom]').click();}
})();
