<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选调生学习系统 · 学生端</title>
<link rel="stylesheet" href="/css/theme.css?v=20260821">
<style>
  /* ===== 学生端页面级覆盖：麦田 + 墨韵遮罩(更亮) ===== */
  body{
    background:
      radial-gradient(1200px 620px at 82% -12%, rgba(95,179,163,.06), transparent 58%),
      linear-gradient(180deg, rgba(14,18,25,.42) 0%, rgba(10,13,18,.62) 100%),
      url(/images/bg-hero.jpg) center/cover no-repeat fixed;
  }
  .who .muted{color:var(--text)}
  .nav{max-width:1120px;margin:16px auto 0;padding:0 16px}
</style>
</head>
<body>
<header>
  <h1><span class="logo">🎓</span> 选调生学习系统</h1>
  <div class="who" id="who">身份：<b id="who-name">未登录</b> <span id="who-email" class="muted"></span> <button onclick="openAuth()">登录/注册</button></div>
</header>

<div class="nav">
  <button data-tab="dashboard" class="active">📊 学习仪表盘</button>
  <button data-tab="courses">📚 课程</button>
  <button data-tab="exam">📝 考试答题</button>
  <button data-tab="morning">🌅 早读</button>
  <button data-tab="classroom">👥 课堂练习</button>
  <button data-tab="wrong">❌ 错题练习</button>
  <button data-tab="memory">🧠 记忆模式</button>
  <button data-tab="mine">📈 我的记录</button>
</div>

<main>
  <!-- 仪表盘（首页） -->
  <section id="tab-dashboard">
    <div id="dash-body"></div>
  </section>

  <!-- 课程 -->
  <section id="tab-courses" class="hidden">
    <div id="courses-body"></div>
  </section>

  <!-- 考试 -->
  <section id="tab-exam" class="hidden">
    <div class="card" id="exam-list-card">
      <h2>可参加的考试 / 专题</h2>
      <div id="exam-list"></div>
    </div>
    <div class="card hidden" id="exam-do-card"><div id="exam-do"></div></div>
  </section>

  <!-- 课堂 -->
  <section id="tab-classroom" class="hidden">
    <div class="card" id="cr-join"><h2>加入课堂</h2>
      <label>课堂房间号</label><input id="cr-room" placeholder="教师提供的 4 位房间号">
      <div class="mt-3"><button class="btn" onclick="joinRoom()">加入课堂</button></div>
      <div id="cr-msg" class="muted" class="mt-3"></div>
    </div>
    <div class="card hidden" id="cr-live"><h2>课堂答题 <span class="tag" id="cr-live-id"></span></h2>
      <div id="cr-live-body" class="muted">等待教师发布题目…</div>
      <div id="cr-live-stats" class="mt-3"></div>
    </div>
    <div class="card" id="law-card">
      <h2>📘 法律常识练习</h2>
      <div id="law-push-list" class="muted">老师尚未推送练习，请稍候。</div>
    </div>
  </section>

  <!-- 错题练习 -->
  <section id="tab-wrong" class="hidden">
    <div class="card"><h2>错题练习</h2>
      <p class="muted">从你的错题库随机抽取题目演练，答对即视为掌握并自动移除。</p>
      <div class="mt-3"><button class="btn" onclick="startPractice()">开始练习（全部错题）</button> <button class="btn ghost" onclick="startPractice(10)">抽取 10 题</button></div>
    </div>
    <div class="card hidden" id="wrong-do"><div id="wrong-do-body"></div></div>
  </section>

  <!-- 记忆模式 -->
  <section id="tab-memory" class="hidden">
    <div class="card">
      <h2>记忆模式 <span class="badge" style="background:rgba(95,179,163,.14);color:var(--gold)">艾宾浩斯</span></h2>
      <p class="muted">开启后，系统按遗忘规律自动安排每道题的复习时间，每天把该复习的题推给你，越记越牢（类似 Anki）。答错会自动缩短间隔、明天再来。</p>
      <div class="stat-grid" id="mem-stats" class="mt-3">
        <div class="stat-box"><div class="num" id="mem-due" class="text-err">0</div><div class="lbl">今日待复习</div></div>
        <div class="stat-box"><div class="num" id="mem-learning">0</div><div class="lbl">学习中</div></div>
        <div class="stat-box"><div class="num" id="mem-mastered">0</div><div class="lbl">已掌握</div></div>
        <div class="stat-box"><div class="num" id="mem-total">0</div><div class="lbl">记忆卡总数</div></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="enableMemory('wrong')">＋ 把我的错题加入记忆</button>
        <button class="btn ghost sm" onclick="enableMemory('all')">＋ 把所有题目加入记忆</button>
        <button class="btn" id="mem-start" onclick="startMemory()">开始今日复习</button>
      </div>
      <p class="muted" class="mt-3">提示：每天打开本页即自动显示「今日待复习」，按时复习即可。</p>
    </div>
    <div class="card hidden" id="mem-do"><div id="mem-do-body"></div></div>
  </section>

  <!-- 早读 -->
  <section id="tab-morning" class="hidden">
    <div id="morning-body"></div>
    <div class="card hidden" id="mr-do"><div id="mr-do-body"></div></div>
  </section>

  <!-- 我的记录 -->
  <section id="tab-mine" class="hidden">
    <div class="card"><h2>我的答题记录</h2><div id="mine-body"></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="live hidden" id="live-dot">● 实时连接中</div>

<!-- 登录 / 注册弹窗 -->
<div id="auth-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-tabs">
      <button data-auth="register" class="active" onclick="switchAuth('register')">注册</button>
      <button data-auth="login" onclick="switchAuth('login')">登录</button>
    </div>
    <div id="auth-register">
      <label>邮箱（用于接收复习提醒）</label>
      <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email">
      <label>姓名</label>
      <input id="reg-name" placeholder="你的姓名" autocomplete="name">
      <label>密码（至少 4 位）</label>
      <input id="reg-pw" type="password" placeholder="设置密码" autocomplete="new-password">
      <button class="btn" style="margin-top:14px;width:100%" onclick="doRegister()">注册并进入</button>
    </div>
    <div id="auth-login" class="hidden">
      <label>邮箱</label>
      <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
      <label>密码</label>
      <input id="login-pw" type="password" placeholder="输入密码" autocomplete="current-password">
      <button class="btn" style="margin-top:14px;width:100%" onclick="doLogin()">登录</button>
    </div>
    <div id="auth-msg" class="muted" class="mt-3"></div>
  </div>
</div>

<script src="/quotes.js"></script>
<script>
const $=(s)=>document.querySelector(s);
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(()=>e.className='toast',2200);}
async function api(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o));const d=await r.json();if(d&&d._error)throw new Error(d.message);return d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- 选项字母 / 多选辅助 ----
const OPTL='ABCDEFGH';
function optL(j){return OPTL[j]||String(Number(j)+1);}
function isMultiQ(q){return q&&(q.type==='multi'||Array.isArray(q.correctAnswer));}
function correctIdx(q){const c=q&&q.correctAnswer;return Array.isArray(c)?c:(typeof c==='number'&&c>=0?[c]:[]);}
function hasAns(q){const c=q&&q.correctAnswer;return Array.isArray(c)?c.length>0:(typeof c==='number'&&c>=0);}
function selIdx(d){const s=d&&d.selected;return Array.isArray(s)?s:(typeof s==='number'&&s>=0?[s]:[]);}
// 结果/解析页选项渲染(单选/多选通用):正确选项✓、误选✗
function detailOptsHTML(d){
  const ca=correctIdx(d), sel=selIdx(d);
  return (d.options||[]).map((o,j)=>{
    let cls='opt',mk='';
    if(ca.includes(j)){cls+=' correct';mk='<span class="mk">✓</span>';}
    else if(sel.includes(j)&&!d.isCorrect){cls+=' wrong';mk='<span class="mk">✗</span>';}
    return `<div class="${cls}">${optL(j)}. ${esc(o)} ${mk}</div>`;
  }).join('');
}
// 通用答案选择(单选/多选)
function pickGen(ansMap,qid,j,el,multi){
  if(multi){
    const arr=(ansMap[qid]||[]).slice();
    const i=arr.indexOf(j);
    if(i>=0)arr.splice(i,1);else arr.push(j);
    ansMap[qid]=arr.length?arr:undefined;
    el.classList.toggle('sel',i<0);
  }else{
    ansMap[qid]=j;
    [...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
  }
}
function pickWrong(qid,j,el,multi){pickGen(wrongAnswers,qid,j,el,multi);}
function pickMem(qid,j,el,multi){pickGen(memAnswers,qid,j,el,multi);}
// 答题页选项行(handler: pickOpt/pickWrong/pickMem)
function optRowsHTML(q,qid,handler){
  const multi=isMultiQ(q);
  return (q.options||[]).map((o,j)=>{
    const fn=multi?`${handler}('${qid}',${j},this,true)`:`${handler}('${qid}',${j},this)`;
    return `<div class="opt" onclick="${fn}">${optL(j)}. ${esc(o)}${multi?' <span class="multi-tag">多选</span>':''}</div>`;
  }).join('');
}
// 正确答案字母串(供多选结果展示)
function correctLetters(d){return correctIdx(d).map(optL).join('');}

// ---- 身份 / 注册登录 ----
let studentKey=localStorage.getItem('quiz_student_key')||'';
let studentName=localStorage.getItem('quiz_student_name')||'';
function showWho(){
  if(studentKey){$('#who-name').textContent=studentName||studentKey;$('#who-email').textContent=studentKey;$('#who').style.display='flex';}
  else{$('#who-name').textContent='未登录';$('#who-email').textContent='';}
}
function openAuth(){switchAuth('register');$('#auth-modal').classList.remove('hidden');$('#auth-msg').textContent='';}
function closeAuth(){$('#auth-modal').classList.add('hidden');}
function switchAuth(m){
  document.querySelectorAll('.modal-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.auth===m));
  $('#auth-register').classList.toggle('hidden',m!=='register');
  $('#auth-login').classList.toggle('hidden',m!=='login');
}
async function doRegister(){
  const email=$('#reg-email').value.trim(),name=$('#reg-name').value.trim(),pw=$('#reg-pw').value;
  if(!email||!name||!pw){$('#auth-msg').textContent='请填写完整信息';return;}
  try{
    const r=await api('/api/register',{method:'POST',body:JSON.stringify({email,name,password:pw})});
    studentKey=r.studentKey;studentName=r.name;
    localStorage.setItem('quiz_student_key',studentKey);localStorage.setItem('quiz_student_name',studentName);
    closeAuth();showWho();toast('注册成功，欢迎 '+studentName,'ok');loadExamList();
  }catch(e){$('#auth-msg').textContent=e.message;}
}
async function doLogin(){
  const email=$('#login-email').value.trim(),pw=$('#login-pw').value;
  if(!email||!pw){$('#auth-msg').textContent='请填写邮箱和密码';return;}
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({email,password:pw})});
    studentKey=r.studentKey;studentName=r.name;
    localStorage.setItem('quiz_student_key',studentKey);localStorage.setItem('quiz_student_name',studentName);
    closeAuth();showWho();toast('登录成功','ok');loadExamList();
  }catch(e){$('#auth-msg').textContent=e.message;}
}
showWho();
if(studentKey)loadDashboard();
if(!studentKey)openAuth();

// ---- Tab ----
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
  const tabId='#tab-'+b.dataset.tab;
  const tab=document.querySelector(tabId);tab.classList.remove('hidden');
  // 进入动画:重置触发重新淡入
  tab.style.animation='none';void tab.offsetWidth;tab.style.animation='fadeUp .45s var(--ease, ease) both';
  // 减暗动画:点击内容标签时短暂压暗背景(聚焦效果)
  document.body.classList.remove('tab-focus');void document.body.offsetWidth;document.body.classList.add('tab-focus');
  if(b.dataset.tab==='dashboard')loadDashboard();
  if(b.dataset.tab==='courses')loadCourses();
  if(b.dataset.tab==='exam')loadExamList();
  if(b.dataset.tab==='mine')loadMine();
  if(b.dataset.tab==='memory')loadMemory();
  if(b.dataset.tab==='morning')loadMorning();
  if(b.dataset.tab==='classroom')loadLawStudent();
});

// ---- 考试列表（折叠视图） ----
let examDataCache = null;

async function loadExamList(){
  if(!studentKey){$('#exam-list').innerHTML='<p class="muted">请先点右上角「登录/注册」进入。</p>';return;}
  try{
    const [exams, progRes, draftsRes] = await Promise.all([
      api('/api/exams'),
      api('/api/exams/progress?key='+encodeURIComponent(studentKey)),
      api('/api/drafts?key='+encodeURIComponent(studentKey))
    ]);
    const box=$('#exam-list');
    if(!exams||!exams.length){box.innerHTML='<p class="muted">老师还没有发布考试。</p>';return;}
    const prog = (progRes&&typeof progRes==='object')?progRes:{};
    const byTop = prog.byTop||{};
    const doneSet = new Set(prog.doneExamIds||[]);
    const ansCounts = prog.answeredCounts||{};
    const draftMap = (draftsRes&&draftsRes.drafts)||{};
    const byCat={};
    exams.forEach(e=>{const c=(e&&e.category)||'国省考真题';(byCat[c]=byCat[c]||[]).push(e);});
    examDataCache={exams,byCat,doneSet,draftMap,byTop,ansCounts};
    renderExamListView();
  }catch(e){toast(e.message,'err');}
}

// 折叠（手风琴）视图：按顶层大类分组，可逐级折叠展开
function renderExamListView(){
  if(!examDataCache) return;
  const {byCat,doneSet,draftMap,byTop,ansCounts}=examDataCache;
  const box=$('#exam-list');
  const topsOrder=['国省考真题','专项','公共基础'];
  const tops=topsOrder.filter(top=>Object.keys(byCat).some(c=>examTopLocal(c)===top && byCat[c] && byCat[c].length));
  box.innerHTML=renderAccordion(tops,byCat,doneSet,draftMap,byTop,ansCounts);
}
// 顶层大类映射（与后端 examTop 保持一致）
function examTopLocal(cat){
  if(cat==='专项'||cat==='公共基础') return cat;
  return '国省考真题';
}
function topLabel(t){
  return {'国省考真题':'📘 国省考真题','专项':'📚 专项训练','公共基础':'📓 公共基础'}[t]||t;
}
const PROV_NAMES=['广东','山东','江苏','浙江','四川','上海','云南','辽宁','安徽','福建','甘肃','广西','贵州','海南','河北','河南','黑龙江','湖北','湖南','江西','内蒙古','宁夏','青海','山西','陕西','天津','新疆','重庆','深圳'];
const CAT_LABEL={ '国考真题':'📘 国考真题','省考真题':'📗 省考真题','选调真题':'📕 选调真题','专项':'📚 专项训练','国省考真题':'📙 其他真题','常识判断':'🔆 常识真题','政治理论':'📜 政治理论','公共基础':'📓 公共基础' };
// 渲染某分类下的试卷列表（省考真题按省份折叠；其余直接列出）
function renderCatGroup(catKey, list, doneSet, draftMap, ansCounts){
  if(catKey==='省考真题'){
    const sub={};
    list.forEach(e=>{
      const m=PROV_NAMES.find(p=>(e.title||'').includes(p))||'其他';
      (sub[m]=sub[m]||[]).push(e);
    });
    return `<div class="exam-group">
      <div class="exam-group-head" onclick="tg('eg-${catKey}')"><span class="caret" id="caret-eg-${catKey}">▸</span><b>${CAT_LABEL[catKey]||catKey}</b><span class="muted">(${list.length}套)</span></div>
      <div class="eg-body" id="eg-${catKey}" style="display:none">${Object.keys(sub).map(p=>`<div class="exam-group">
        <div class="exam-group-head" onclick="tg('eg-${catKey}-${p}')"><span class="caret" id="caret-eg-${catKey}-${p}">▸</span><b>${esc(p)}</b><span class="muted">(${sub[p].length}套)</span></div>
        <div class="eg-body" id="eg-${catKey}-${p}" style="display:none">${sub[p].map(e=>examCardHTML(e,doneSet,draftMap[e.id],null,ansCounts)).join('')}</div>
      </div>`).join('')}</div>
    </div>`;
  }
  return `<div class="exam-group">
    <div class="exam-group-head" onclick="tg('eg-${catKey}')"><span class="caret" id="caret-eg-${catKey}">▸</span><b>${CAT_LABEL[catKey]||catKey}</b><span class="muted">(${list.length}套)</span></div>
    <div class="eg-body" id="eg-${catKey}" style="display:none">${list.map(e=>examCardHTML(e,doneSet,draftMap[e.id],null,ansCounts)).join('')}</div>
  </div>`;
}
function examCardHTML(e, doneSet, draft, variant, ansCounts){
  const done = doneSet && doneSet.has(e.id);
  const qn = (e.questionIds||[]).length;
  const ansN = ansCounts && ansCounts[e.id] ? ansCounts[e.id] : 0;
  let actions = `<button class="btn sm" onclick="enterExam('${e.id}')">开始答题</button>`;
  let tags = '';
  if((e.title||'').includes('政治理论')){
    tags += `<span class="tag-draft" style="border-color:var(--warn)">⚠️ 已过时 · 仅作参考</span>`;
  }
  if(draft&&typeof draft==='object'){
    tags += `<span class="tag-draft">草稿·已答 ${(draft.answered||0)}/${(draft.total||0)}</span>`;
    actions = `<button class="btn sm" onclick="enterExam('${e.id}')">继续作答</button> <button class="btn ghost sm" onclick="restartExam('${e.id}')">重做</button>`;
  } else if(done){
    tags += `<span class="tag-done">✓ 已完成</span>`;
    actions = `<button class="btn sm" onclick="enterExam('${e.id}')">再做一次</button>`;
  } else if(ansN>0 && ansN<qn){
    tags += `<span class="tag-draft">已做 ${ansN}/${qn}</span>`;
    actions = `<button class="btn sm" onclick="enterExam('${e.id}')">继续作答</button> <button class="btn ghost sm" onclick="restartExam('${e.id}')">重做</button>`;
  }
  const catTag = e.category ? `<span class="ev-cat-tag">${CAT_LABEL[e.category]||e.category}</span>` : '';
  const head = (variant==='grid') ? `<div class="ev-card-top"><span class="ev-card-ico">${catIcon(e.category)}</span>${catTag}</div>` : '';
  return `<div class="exam-card${variant?(' ev-'+variant):''}${done?' done':''}">${head}<div class="info"><b>${esc(e.title)}</b>${tags}<div class="meta">${qn} 题 · ${new Date(e.createdAt).toLocaleDateString()} · 不限时</div></div><div class="acts">${actions}</div></div>`;
}
// 专项训练：按 20 题一组拆分，套件折叠、组卡直接作答（不走选题数面板）
function topicGroupHTML(e, ansCounts){
  const qids=(e.questionIds||[]);
  const n=qids.length;
  const g=Math.max(1,Math.ceil(n/20));
  const ansN=(ansCounts&&ansCounts[e.id])?ansCounts[e.id]:0;
  let cards='';
  for(let i=0;i<g;i++){
    const a=i*20+1, b=Math.min((i+1)*20,n);
    cards+=`<div class="exam-card"><div class="info"><b>第 ${i+1} 组</b><div class="meta">第 ${a}-${b} 题 · ${b-a+1} 题 · 直接作答</div></div><div class="acts"><button class="btn sm" onclick="enterExamGroup('${e.id}',${i})">开始答题</button></div></div>`;
  }
  return `<div class="exam-group">
    <div class="exam-group-head" onclick="tg('eg-topic-${e.id}')"><span class="caret" id="caret-eg-topic-${e.id}">▸</span><b>${esc(e.title)}</b><span class="muted">共 ${n} 题 · ${g} 组（每组20题）${ansN?` · 已答 ${ansN}/${n}`:''}</span></div>
    <div class="eg-body" id="eg-topic-${e.id}" style="display:none">${cards}</div>
  </div>`;
}
function tg(id){
  const body=document.getElementById(id),caret=document.getElementById('caret-'+id);
  if(!body)return;
  const open=body.style.display!=='none';
  body.style.display=open?'none':'';
  if(caret)caret.textContent=open?'▸':'▾';
}

// 顶层大类图标 / 类别图标
function topIcon(top){return {'国省考真题':'📘','常识判断':'🔆','公共基础':'📓','专题':'📚'}[top]||'📁';}
function catIcon(cat){return {'国考真题':'📘','省考真题':'📗','选调真题':'📕','专项':'📚','国省考真题':'📙','常识判断':'🔆','政治理论':'📜','公共基础':'📓'}[cat]||'•';}

// 折叠（手风琴）视图：国省考真题(常识/政治理论/其他) + 专项独立列表 + 公共基础
function renderAccordion(tops,byCat,doneSet,draftMap,byTop,ansCounts){
  return tops.map(top=>{
    const t=byTop[top]||{done:0,total:0,percent:0};
    let body='';
    if(top==='国省考真题'){
      // 常识真题 / 政治理论(过时) / 其他真题(国考省考选调,省考按省份)
      const cn=flattenCat(byCat,'常识判断');
      const zz=flattenCat(byCat,'政治理论');
      if(cn.length) body+=subGroup('eg-top-gk-cn','🔆 常识真题',cn,doneSet,draftMap,ansCounts);
      if(zz.length) body+=subGroup('eg-top-gk-zz','📜 政治理论（已过时 · 仅作参考）',zz,doneSet,draftMap,ansCounts);
      ['国考真题','省考真题','选调真题','国省考真题'].forEach(c=>{
        if(byCat[c]&&byCat[c].length) body+=renderCatGroup(c,byCat[c],doneSet,draftMap,ansCounts);
      });
    }else if(top==='专项'){
      const list=flattenCat(byCat,'专项');
      if(list.length) body+=`<div class="eg-body" style="border-left:none;margin-left:0;padding-left:0">${list.map(e=>topicGroupHTML(e,ansCounts)).join('')}</div>`;
    }else{
      const cats=Object.keys(byCat).filter(c=>examTopLocal(c)===top && byCat[c] && byCat[c].length);
      body=cats.map(c=>renderCatGroup(c,byCat[c],doneSet,draftMap,ansCounts)).join('');
    }
    if(!body) return '';
    return `<div class="exam-group">
      <div class="exam-group-head" onclick="tg('eg-top-${top}')">
        <span class="caret" id="caret-eg-top-${top}">▸</span>
        <b>${topLabel(top)}</b>
        <span class="cat-progress">已完成 ${t.done} / 共 ${t.total}
          <span class="cat-bar"><i style="width:${t.percent}%"></i></span>
          <b style="color:var(--ok)">${t.percent}%</b>
        </span>
      </div>
      <div class="eg-body" id="eg-top-${top}" style="border-left:none;margin-left:0;padding-left:0;display:none">${body}</div>
    </div>`;
  }).join('');
}
function flattenCat(byCat,key){return (byCat[key]&&byCat[key].length)?byCat[key]:[];}
function subGroup(id,label,list,doneSet,draftMap,ansCounts){
  return `<div class="exam-group">
    <div class="exam-group-head" onclick="tg('${id}')"><span class="caret" id="caret-${id}">▸</span><b>${label}</b><span class="muted">(${list.length}套)</span></div>
    <div class="eg-body" id="${id}" style="display:none">${list.map(e=>examCardHTML(e,doneSet,draftMap[e.id],null,ansCounts)).join('')}</div>
  </div>`;
}

// ---- 考试答题 ----
let examData=null,examAnswers={},examSeq=[],examTotal=0,examIdCurrent=null,_ppCount=null;
let examAnsweredQids=[],_excludeAnswered=false;
function pickOpt(qid,j,el,multi){pickGen(examAnswers,qid,j,el,multi);renderNav();}

// 进入考试：展示「选练几题」开始面板（或草稿续作 / 接着做剩余题）
async function enterExam(id){
  try{
    examIdCurrent=id; _ppCount=null;
    const ed=await api('/api/exams/'+id);
    if(!ed||typeof ed!=='object')throw new Error('考试不存在');
    if(!Array.isArray(ed.questions))ed.questions=[];
    examData=ed;
    const draftResp=await api('/api/exams/'+id+'/draft?key='+encodeURIComponent(studentKey));
    const draft=draftResp&&draftResp.draft;
    examAnsweredQids=(draftResp&&draftResp.answeredQids)||[];
    _excludeAnswered=false;
    const total=examData.questions.length;
    const answered=examAnsweredQids.length;
    let h=`<div class="start-panel">
      <h2>${esc(examData.title)}</h2>
      <p class="muted">共 ${total} 题 · 不限时 · 每次「开始练习」都会<b>重新随机抽取</b>一套（不沿用上次题目）</p>
      <div class="practice-pick">
        <div class="pp-title">本次练习几题？（每次随机重抽）</div>
        <div class="pp-opts" id="pp-opts">`;
      const presets=[10,20,30,50].filter(n=>n<total);
      let optsHtml=`<button class="pp-btn${total<=10?' active':''}" data-n="${total}" onclick="pickCount(this,${total})">全部（${total}）</button>`;
      presets.forEach(n=>{optsHtml+=`<button class="pp-btn" data-n="${n}" onclick="pickCount(this,${n})">${n} 题</button>`;});
      optsHtml+=`<button class="pp-btn" data-n="custom" onclick="pickCount(this,'custom')">自定义</button>`;
      h+=optsHtml+`</div>
        <div id="pp-custom-wrap" style="display:none;margin-top:10px">自定义题数：<input id="pp-custom" type="number" min="1" max="${total}" value="${Math.min(10,total)}" style="width:90px;padding:6px;border:1px solid var(--border);border-radius:8px"> <span class="muted">（最多 ${total}）</span></div>
      </div>
      <button class="btn" onclick="startExamPractice('${id}')">开始练习（全新随机）</button>`;
    // 已答过 → 额外提供「接着做未答的题」（不重复）与「清空记录」，但主入口仍是上面的全新随机
    if(answered>0&&answered<total){
      h+=`<div class="draft-box" style="margin-top:14px">
        <div class="draft-tip">📈 已做 ${answered} / ${total} 题</div>
        <button class="btn ghost" onclick="continueExam('${id}')">接着做剩余未答的 ${total-answered} 题（不重复）</button>
        <button class="btn ghost" onclick="clearAndStart('${id}')">清空记录·从头开始</button>
      </div>`;
    }else if(answered>=total){
      h+=`<div class="draft-box" style="margin-top:14px">
        <div class="draft-tip">✅ 本卷已全部完成（${total} 题）</div>
        <button class="btn ghost" onclick="redoExam('${id}')">再做一次（全新随机）</button>
      </div>`;
    }
    if(draft&&Array.isArray(draft.seq)&&draft.seq.length){
      const dAnswered=Object.keys(draft.answers||{}).length;
      h+=`<div class="draft-box" style="margin-top:14px">
        <div class="draft-tip">📌 检测到上次暂存的草稿</div>
        <button class="btn ghost" onclick="resumeExam('${id}')">继续上次作答（${(draft.seq||[]).length} 题 · 已答 ${dAnswered}）</button>
      </div>`;
    }
    h+=`</div>`;
    $('#exam-do').innerHTML=h;$('#exam-list-card').classList.add('hidden');$('#exam-do-card').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
// 专项组模式：直接进入某一组（20题一组，按原顺序作答，无选题数面板）
async function enterExamGroup(id, gi){
  try{
    examIdCurrent=id;
    const ed=await api('/api/exams/'+id);
    if(!ed||typeof ed!=='object')throw new Error('考试不存在');
    if(!Array.isArray(ed.questions))ed.questions=[];
    examData=ed;
    const seq=ed.questions.slice(gi*20,gi*20+20).map(q=>q.id);
    if(!seq.length){toast('该组暂无题目','err');return;}
    examSeq=seq;examTotal=seq.length;examAnswers={};_ppCount=null;
    renderExamQuestions();
  }catch(e){toast(e.message,'err');}
}
function pickCount(el,n){
  document.querySelectorAll('#pp-opts .pp-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); _ppCount=n;
  $('#pp-custom-wrap').style.display=(n==='custom')?'block':'none';
}
// 清空草稿并重新选练
async function clearAndStart(id){
  try{await api('/api/exams/'+id+'/draft?key='+encodeURIComponent(studentKey),{method:'DELETE'});}catch(e){}
  enterExam(id);
}
function restartExam(id){clearAndStart(id);}
// 接着做剩余题（练习池排除已做过的题）
function continueExam(id){
  _excludeAnswered=true; _ppCount=null;
  startExamPractice(id);
}
// 全部做完后再做一次
function redoExam(id){_excludeAnswered=false;_ppCount=null;startExamPractice(id);}
// 开始一次新练习（按所选题数抽取；接着做时排除已答题）—— 注意：与错题练习的 startPractice(count) 区分
async function startExamPractice(id){
  let n=_ppCount;
  if(n==='custom'){n=parseInt($('#pp-custom').value,10)||0;}
  if(!n||n<1){toast('请选择练习题数','err');return;}
  const total=examData.questions.length;
  n=Math.min(n,total);
  let pool=examData.questions.slice();
  if(_excludeAnswered){
    const as=new Set(examAnsweredQids);
    pool=pool.filter(q=>!as.has(q.id));
    if(!pool.length)pool=examData.questions.slice(); // 已全部做完 → 重做
  }
  let seq;
  if(n>=pool.length){seq=pool.map(q=>q.id);}
  else{
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    seq=pool.slice(0,n).map(q=>q.id);
  }
  examSeq=seq;examTotal=seq.length;examAnswers={};
  renderExamQuestions();
}
// 续作草稿
async function resumeExam(id){
  try{
    const r=await api('/api/exams/'+id+'/draft?key='+encodeURIComponent(studentKey));
    const d=r&&r.draft; if(!d){enterExam(id);return;}
    examSeq=d.seq&&d.seq.length?d.seq:examData.questions.map(q=>q.id);
    examTotal=examSeq.length;examAnswers=d.answers||{};
    renderExamQuestions();
  }catch(e){toast(e.message,'err');}
}
// 渲染题目 + 顶部工具栏 + 题号导航
// 一键加入错题（学生主动把不会的题加入错题库）
function wrongBtnHTML(qid){
  return `<button class="wrong-add" type="button" onclick="addWrong('${qid}',this)">＋ 加入错题本</button>`;
}
async function addWrong(qid,btn){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{
    const r=await api('/api/wrong/add',{method:'POST',body:JSON.stringify({studentKey,qid})});
    if(r&&r.ok){
      toast(r.already?'已在错题本':'已加入错题本','ok');
      if(btn){btn.classList.add('done');btn.textContent='✓ 已在错题本';btn.disabled=true;}
    }else toast((r&&r._error)||'加入失败','err');
  }catch(e){toast(e.message,'err');}
}
function renderExamQuestions(){
  const questions=Array.isArray(examData.questions)?examData.questions:[];
  const qmap={};questions.forEach(q=>qmap[q.id]=q);
  let h=`<div class="exam-toolbar">
    <div><b>${esc(examData.title||'')}</b><div class="muted" id="exam-progress">共 ${examTotal} 题 · 已答 0</div></div>
    <div class="exam-toolbar-acts">
      <button class="btn sm" onclick="submitExam('${examIdCurrent}')">交卷看成绩</button>
      <button class="btn ghost sm" onclick="saveDraftNow('${examIdCurrent}')">暂存进度</button>
      <button class="btn ghost sm" onclick="backToExams()">返回列表</button>
    </div>
  </div>
  <div class="qnav" id="qnav"></div>`;
  examSeq.forEach((qid,i)=>{
    const q=qmap[qid];if(!q)return;
    h+=`<div class="q" id="qbox-${i}"><div class="qt">${i+1}. ${esc(q.title)} ${isMultiQ(q)?'<span class="badge multi">多选</span>':''}</div>`;
    h+=optRowsHTML(q,q.id,'pickOpt');
    h+=wrongBtnHTML(q.id);
    h+=`</div>`;
  });
  h+=`<div class="center" style="margin:18px 0"><button class="btn" onclick="submitExam('${examIdCurrent}')">交卷看成绩</button> <button class="btn ghost" onclick="saveDraftNow('${examIdCurrent}')">暂存进度</button></div>`;
  $('#exam-do').innerHTML=h;$('#exam-list-card').classList.add('hidden');$('#exam-do-card').classList.remove('hidden');
  window.scrollTo(0,0);renderNav();
}
// 题号导航（显示作答状态）
function renderNav(){
  const nav=$('#qnav');if(!nav)return;
  let html='';let answered=0;
  examSeq.forEach((qid,i)=>{
    const a=examAnswers[qid];
    const done=(a!==undefined)&&!(Array.isArray(a)&&!a.length);
    if(done)answered++;
    html+=`<button class="qn${done?' on':''}" onclick="gotoQ(${i})">${i+1}</button>`;
  });
  nav.innerHTML=html;
  const p=$('#exam-progress');if(p)p.textContent=`共 ${examTotal} 题 · 已答 ${answered}`;
}
function gotoQ(i){const el=document.getElementById('qbox-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
// 暂存草稿（返回列表前自动调用）
async function saveDraftNow(id){
  const r=await api('/api/exams/'+id+'/draft',{method:'POST',body:JSON.stringify({studentKey,answers:examAnswers,seq:examSeq,idx:0,count:examSeq.length,total:examSeq.length})});
  return r&&r.ok;
}
function backToExams(){
  const hasAns=Object.keys(examAnswers).some(k=>{const a=examAnswers[k];return a!==undefined&&!(Array.isArray(a)&&!a.length);});
  if(hasAns){saveDraftNow(examIdCurrent).then(()=>_goList()).catch(()=>_goList());}
  else _goList();
}
function _goList(){$('#exam-list-card').classList.remove('hidden');$('#exam-do-card').classList.add('hidden');loadExamList();loadMine();}
async function submitExam(id){
  const answeredCount=examSeq.filter(qid=>{const a=examAnswers[qid];return a!==undefined&&!(Array.isArray(a)&&!a.length);}).length;
  const unanswered=examTotal-answeredCount;
  if(unanswered&&!confirm(`还有 ${unanswered} 题未作答，确认交卷？`))return;
  try{
    const r=(await api('/api/exams/'+id+'/submit',{method:'POST',body:JSON.stringify({studentKey,studentName:studentName,answers:examAnswers,questionIds:examSeq})}))||{};
    const wrongAdded=Array.isArray(r.wrongAdded)?r.wrongAdded:[];
    const details=Array.isArray(r.details)?r.details:[];
    let h=`<div class="result-head"><div class="score">${typeof r.score==='number'?r.score:0}分</div><div class="muted">答对 ${r.correct||0} / 共 ${r.total||0} 题${wrongAdded.length?` · 新增 ${wrongAdded.length} 道错题`:''}</div></div>`;
    details.forEach((d,i)=>{
      h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓ 正确</span>':'<span class="badge err">✗ 错误</span>'}</div>`;
      h+=detailOptsHTML(d);
      if(isMultiQ(d)&&hasAns(d))h+=`<div class="ana">正确答案：<b>${correctLetters(d)}</b></div>`;
      if(d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;
      h+=`</div>`;
    });
    h+=`<div class="center"><button class="btn ghost" onclick="backToExams()">返回考试列表</button></div>`;
    $('#exam-do').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}

// ---- 课堂 ----
let crRoomId=null,crStudentId=null,crPollTimer=null,crAnswered={};
async function joinRoom(){
  const id=$('#cr-room').value.trim().toUpperCase();if(!id){toast('请输入房间号','err');return;}
  try{const d=await api('/api/join-room',{method:'POST',body:JSON.stringify({roomId:id,name:studentKey||'同学'})});
    crRoomId=id;crStudentId=d.studentId;$('#cr-join').classList.add('hidden');$('#cr-live').classList.remove('hidden');$('#cr-live-id').textContent=id;$('#live-dot').classList.remove('hidden');pollLoop();
  }catch(e){$('#cr-msg').textContent='加入失败：'+e.message;$('#cr-msg').className='err';}
}
async function pollLoop(){
  if(crPollTimer)clearInterval(crPollTimer);
  crPollTimer=setInterval(async()=>{
    try{const d=await api('/api/poll?roomId='+crRoomId+'&studentId='+crStudentId+'&for=student');
      if(d.type==='room-closed'){$('#cr-live-body').innerHTML='<p class="muted">课堂已结束。</p>';clearInterval(crPollTimer);$('#live-dot').classList.add('hidden');return;}
      renderLive(d);
    }catch(e){}
  },1500);
}
function renderLive(d){
  $('#cr-live-body').innerHTML='';
  if(d.state==='waiting'){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  if(!d.question){$('#cr-live-body').innerHTML='<p class="muted">等待教师发布题目…</p>';return;}
  const q=d.question;
  const opts=Array.isArray(q.options)?q.options:[];
  let h=`<div class="q"><div class="qt">${esc(q.title)}</div>`;
  opts.forEach((o,j)=>{
    let cls='opt';let mk='';
    const ca=correctIdx(d.question);
    if(d.state==='showing'&&ca.includes(j)){cls+=' correct';mk='<span class="mk">✓</span>';}
    if(crAnswered[q.index]===j&&d.state==='showing'&&!ca.includes(j)){cls+=' wrong';mk='<span class="mk">✗</span>';}
    h+=`<div class="${cls}" ${d.state==='answering'?`onclick="sendAnswer(${q.index},${j},this)"`:''}>${optL(j)}. ${esc(o)} ${mk}</div>`;
  });
  if(d.state==='answering')h+=`<div class="muted" class="mt-2">点击选项作答，可修改。</div>`;
  if(d.state==='showing')h+=`<div class="ana">${hasAns(d.question)?('正确答案：'+(isMultiQ(d.question)?correctLetters(d.question):optL(d.question.correctAnswer))):''}</div>`;
  h+=`</div>`;
  $('#cr-live-body').innerHTML=h;
  // 统计
  if(d.stats){const counts=Array.isArray(d.stats.counts)?d.stats.counts:[];let s=`<div class="pill">已答 ${d.stats.answered||0}/${d.stats.totalStudents||0}</div>`;counts.forEach((c,i)=>{if(opts[i]!==undefined)s+=`<div class="pill">${opts[i]}: ${d.stats.percentages?d.stats.percentages[i]:''}%</div>`;});$('#cr-live-stats').innerHTML=s;}
}
async function sendAnswer(idx,j,el){
  if(crAnswered[idx]!==undefined){[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));}
  crAnswered[idx]=j;el.classList.add('sel');
  try{await api('/api/submit-answer',{method:'POST',body:JSON.stringify({roomId:crRoomId,studentId:crStudentId,answer:j})});}catch(e){toast(e.message,'err');}
}

// ---- 法律常识课堂练习（学生端：多推送列表） ----
let lawState=null;
async function loadLawStudent(){
  const card=document.getElementById('law-card');if(!card)return;
  try{
    const [pushs, mine]=await Promise.all([
      api('/api/law/push'),
      api('/api/law/myrecords?key='+encodeURIComponent(studentKey))
    ]);
    const box=document.getElementById('law-push-list');if(!box)return;
    if(!pushs||!pushs.length){box.innerHTML='<p class="muted">老师尚未推送练习，请稍候。</p>';return;}
    const secMap={};
    (mine&&mine.sections||[]).forEach(s=>{secMap[s.cat+'|'+s.section]=s.percent;});
    box.innerHTML=pushs.map(p=>{
      const my=secMap[p.cat+'|'+p.section];
      const meta=my!==undefined?`<div class="meta">我的正确率 <b style="color:var(--ok)">${my}%</b></div>`:'<div class="meta">尚未作答</div>';
      return `<div class="exam-card" style="margin-bottom:8px"><div class="info"><b>${esc(p.cat)} · ${esc(p.section)}</b>${meta}</div><div class="acts"><button class="btn sm" onclick="startLaw('${esc(p.cat)}','${esc(p.section)}')">开始练习</button></div></div>`;
    }).join('');
  }catch(e){}
}
async function startLaw(cat,section){
  if(!studentKey){toast('请先登录/注册','err');return;}
  let qs;
  try{ qs=await api('/api/law/questions?cat='+encodeURIComponent(cat||'')+'&section='+encodeURIComponent(section)); }
  catch(e){toast(e.message,'err');return;}
  if(!qs||!qs.length){toast('该部分暂无题目','err');return;}
  lawState={cat:cat||'',section,questions:qs,answers:{}};
  renderLawQ();
}
function renderLawQ(){
  const s=lawState;if(!s)return;
  const card=document.getElementById('law-card');if(!card)return;
  const total=s.questions.length;
  let h=`<div class="flex-between"><button class="btn ghost sm" onclick="exitLaw()">← 返回</button><span>📘 ${esc(s.cat||'')} · ${esc(s.section||'')} · ${total} 题</span></div>`;
  s.questions.forEach((q,i)=>{
    h+=`<div class="q"><div class="qt">${i+1}. ${esc(q.title)} ${q.type==='judge'?'<span class="badge judge">判断</span>':''}</div>`;
    if(q.type==='judge'){
      h+=`<div class="opt${s.answers[q.id]===0?' sel':''}" onclick="lawPick('${q.id}',0,this)">正确</div><div class="opt${s.answers[q.id]===1?' sel':''}" onclick="lawPick('${q.id}',1,this)">错误</div>`;
    }else{
      q.options.forEach((o,j)=>{
        h+=`<div class="opt${s.answers[q.id]===j?' sel':''}" onclick="lawPick('${q.id}',${j},this)">${optL(j)}. ${esc(o)}</div>`;
      });
    }
    h+=`</div>`;
  });

function lawPick(qid,j,el){

async function submitLawQ(){
  const s=lawState;if(!s)return;
  const answered=Object.keys(s.answers).length;
  if(answered<s.questions.length&&!confirm(`还有 ${s.questions.length-answered} 题未作答，确认提交？`))return;
  let r;
  try{ r=await api('/api/law/submit',{method:'POST',body:JSON.stringify({studentKey,cat:s.cat,section:s.section,answers:s.answers})}); }
  catch(e){toast(e.message,'err');return;}
  const card=document.getElementById('law-card');if(!card)return;
  let h=`<div class="result-head"><div class="score">${r.score}分</div><div class="muted">答对 ${r.correct} / 共 ${r.total} 题${r.wrongAdded?` · 已加入错题本 ${r.wrongAdded} 题`:''}</div></div>`;
  (r.details||[]).forEach((d,i)=>{
    h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓ 正确</span>':'<span class="badge err">✗ 错误</span>'} ${d.type==='judge'?'<span class="badge judge">判断</span>':''}</div>`;
    if(d.type==='judge'){
      h+=`<div class="opt ${d.isCorrect?'correct':(d.selected===0?'wrong':'')}">正确 ${d.correctAnswer!==undefined&&d.correctAnswer===0?'<span class="mk">✓</span>':''}</div><div class="opt ${d.isCorrect?'correct':(d.selected===1?'wrong':'')}">错误 ${d.correctAnswer!==undefined&&d.correctAnswer===1?'<span class="mk">✓</span>':''}</div>`;
    }else{
      d.options.forEach((o,j)=>{
        let cls='opt';
        if(d.correctAnswer!==undefined&&d.correctAnswer===j)cls+=' correct';
        if(d.selected===j&&d.isCorrect===false)cls+=' wrong';
        h+=`<div class="${cls}">${optL(j)}. ${esc(o)} ${d.correctAnswer!==undefined&&d.correctAnswer===j?'<span class="mk">✓</span>':''}</div>`;
      });
    }
    if(d.analysis!==undefined&&d.analysis)h+=`<div class="ana">解析：${esc(d.analysis)}</div>`;
    h+=`</div>`;
  });
  h+=`<div class="center"><button class="btn ghost" onclick="exitLaw()">返回课堂</button></div>`;
  card.innerHTML=h;window.scrollTo(0,0);
}
function exitLaw(){

}

  try{await api('/api/courses/'+cid+'/lessons/'+lsid+'/done',{method:'POST',body:JSON.stringify({studentKey,done:!done})});

    const btn=$('#lsbtn-'+lsid);const card=btn.closest('.lesson');
    if(done){btn.textContent='标记完成';btn.classList.remove('ghost');card.classList.remove('done');}
    else{btn.textContent='✓ 已完成（点击取消）';btn.classList.add('ghost');card.classList.add('done');}
    toast(done?'已取消完成':'已标记完成','ok');loadDashboard();
  }catch(e){toast(e.message,'err');}
}

// ---- 早读 ----
async function loadMorning(){
  if(!studentKey){$('#morning-body').innerHTML='<p class="muted">请先登录/注册。</p>';return;}
  const today=new Date().toISOString().slice(0,10);
  try{
    const tRaw=await api('/api/morning/today?key='+encodeURIComponent(studentKey)+'&date='+today);
    const t=(tRaw&&typeof tRaw==='object')?tRaw:{items:[],checkin:{done:false,readingIds:[]}};
    const items=Array.isArray(t.items)?t.items:[];
    const checkin=(t.checkin&&typeof t.checkin==='object')?t.checkin:{done:false,readingIds:[]};
    const ownRaw=await api('/api/morning?ownerKey='+encodeURIComponent(studentKey)+'&scope=student');
    const ownArr=Array.isArray(ownRaw)?ownRaw:[];
    const mrRaw=await api('/api/morning/memory/stats?key='+encodeURIComponent(studentKey));
    const mr=(mrRaw&&typeof mrRaw==='object')?mrRaw:{due:0,learning:0,mastered:0,total:0};
    const hwRaw=await api('/api/morning/homework?date='+today);
    const hw=Array.isArray(hwRaw)?hwRaw:[];
    morningToday=t;
    let h='<div class="card"><h2>🌅 今日早读打卡 <span class="tag">'+today+'</span></h2>';
    if(!items.length){h+='<p class="muted">老师尚未推送早读，也没有自建早读。可在下方「我的早读规划」自建。</p>';}
    else{
      h+=`<p class="muted">${checkin.done?'✅ 今日已打卡':'请阅读下列内容后完成打卡（每日必做）'}</p><div id="morning-items">`;
      const rids=Array.isArray(checkin.readingIds)?checkin.readingIds:[];
      items.forEach(m=>{const chk=rids.includes(m.id);h+=`<div class="morning-item ${chk?'checked':''}"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" class="mchk" value="${m.id}" ${chk?'checked':''} style="margin-top:5px"><div><div style="font-weight:600">${esc(m.title)}</div><div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(m.content||'')}</div></div></label></div>`;});
      h+='</div>';
      h+=`<div class="btnrow"><button class="btn" onclick="doCheckin()">${checkin.done?'取消打卡':'完成今日打卡'}</button></div>`;
      if(hw.length){h+='<hr style="margin:16px 0;border:none;border-top:1px solid var(--border)"><h2 style="font-size:15px">📋 今日早读作业</h2>';hw.forEach(hh=>{h+=`<div class="lesson"><div class="flex-between"><b>${esc(hh.title)}</b><button class="btn ghost sm" onclick="doHomework('${hh.id}')">去完成</button></div><div class="muted" style="margin-top:4px">${Array.isArray(hh.questionIds)?hh.questionIds.length:0} 题${hh.examId?'（来自考试）':''}</div></div>`;});}
    }
    h+='</div>';
    h+='<div class="card" class="mt-5"><h2>📝 规范词记忆卡 <span class="tag">Anki 式</span></h2>';
    h+='<p class="muted" class="mt-2">每天 10 个新词 + 按记忆曲线复习旧词。先看应用场景回忆规范词，点击翻面后再选「记得 / 模糊 / 不记得」，系统按你的选择安排下次推送。</p>';
    h+='<div class="stat-grid" class="mt-2"><div class="stat-box"><div class="num" id="sp-total">0</div><div class="lbl">词库</div></div><div class="stat-box"><div class="num" id="sp-learned">0</div><div class="lbl">已学</div></div><div class="stat-box"><div class="num" id="sp-due">0</div><div class="lbl">待复习</div></div><div class="stat-box"><div class="num" id="sp-new">0/10</div><div class="lbl">今日新词</div></div></div>';
    h+='<div class="btnrow"><button class="btn" id="sp-start" onclick="startSpSession()">开始今日记忆</button></div>';
    h+='</div>';
    h+='<div class="card" class="mt-5"><h2>🧠 早读记忆复习 <span class="tag">艾宾浩斯</span></h2>';
    h+=`<div class="stat-grid" class="mt-2"><div class="stat-box"><div class="num" class="text-err">${mr.due}</div><div class="lbl">今日待复习</div></div><div class="stat-box"><div class="num">${mr.learning}</div><div class="lbl">学习中</div></div><div class="stat-box"><div class="num">${mr.mastered}</div><div class="lbl">已掌握</div></div><div class="stat-box"><div class="num">${mr.total}</div><div class="lbl">记忆卡</div></div></div>`;
    h+='<p class="muted" class="mt-2">把已打卡的早读加入记忆后，系统按遗忘曲线自动安排复习。</p>';
    h+=`<div class="btnrow"><button class="btn ghost sm" onclick="enableMr()">＋ 把今日早读加入记忆</button><button class="btn" id="mr-start" onclick="startMr()" ${mr.due?'':'disabled'}>开始今日复习</button></div>`;
    h+='</div>';
    h+='<div class="card" class="mt-5"><h2>🗓️ 我的早读规划（自建）</h2><div class="row"><div style="flex:2"><label>标题</label><input id="mr-title" placeholder="如：背诵习近平金句 10 条"></div></div><label>内容</label><textarea id="mr-content" placeholder="早读文本 / 知识点…"></textarea><div class="btnrow"><button class="btn" onclick="addMyMorning()">添加我的早读</button></div><div id="my-morning-list" class="mt-3"></div></div>';
    h+='<div class="card" class="mt-5"><h2>📅 早读复习日程表</h2><div id="mr-schedule"></div></div>';
    $('#morning-body').innerHTML=h;
    renderMyMorning(ownArr);renderSchedule();loadSpWidget();
  }catch(e){toast(e.message,'err');}
}
// ---- 规范词记忆卡（Anki 式：记得/模糊/不记得三选） ----
let spState=null;
async function loadSpWidget(){
  if(!studentKey)return;
  try{
    const d=await api('/api/spwords/daily?key='+encodeURIComponent(studentKey));
    const s=d.stats||{};
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
    set('sp-total',s.total||0);set('sp-learned',s.learned||0);set('sp-due',s.due||0);
    set('sp-new',(d.todayNew||0)+'/'+(d.newLimit||10));
    const btn=document.getElementById('sp-start');
    if(btn)btn.disabled=!(d.dueCards&&d.dueCards.length)&&!(d.newCards&&d.newCards.length);
  }catch(e){}
}
async function startSpSession(){
  if(!studentKey){toast('请先登录/注册','err');return;}
  let d;
  try{ d=await api('/api/spwords/daily?key='+encodeURIComponent(studentKey)); }
  catch(e){toast(e.message,'err');return;}
  // 先复习旧词，再学新词
  const queue=(d.dueCards||[]).map(c=>Object.assign({isNew:false},c))
    .concat((d.newCards||[]).map(c=>Object.assign({isNew:true},c)));
  if(!queue.length){toast('今日没有需要记忆的词，明天再来 🎉','ok');return;}
  spState={queue,idx:0};
  renderSpCard();
}
function renderSpCard(){
  if(!spState)return;
  if(spState.idx>=spState.queue.length){spDone();return;}
  const c=spState.queue[spState.idx], total=spState.queue.length;
  const tag=c.isNew?'<span class="tag-draft">新词</span>':'<span class="tag-done">复习</span>';
  $('#morning-body').innerHTML=`<div class="card">
    <div class="flex-between"><button class="btn ghost sm" onclick="loadMorning()">← 返回早读</button><span>${tag} 第 ${spState.idx+1}/${total} 张</span></div>
    <div class="sp-card">
      <div class="sp-label">应用场景 · 请填写对应的规范词</div>
      <div class="sp-scene">${esc(c.scene||'')}</div>
      <input class="sp-input" id="sp-input" placeholder="输入规范词…" autocomplete="off">
      <div class="btnrow"><button class="btn" onclick="checkSp()">检查</button></div>
      <div id="sp-check-result" class="sp-check-result"></div>
    </div>
    <div class="btnrow" id="sp-actions" style="display:none">
      <button class="btn danger" onclick="gradeSp('forgot')">不熟悉</button>
      <button class="btn" onclick="gradeSp('fuzzy')">模糊</button>
      <button class="btn ok" onclick="gradeSp('remember')">熟悉</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
async function checkSp(){
  if(!spState)return;
  const c=spState.queue[spState.idx];
  const inp=document.getElementById('sp-input');if(!inp)return;
  const ans=inp.value.trim();
  if(!ans){toast('请先填写规范词','err');return;}
  let r;
  try{ r=await api('/api/spwords/check',{method:'POST',body:JSON.stringify({studentKey,wordId:c.id,answer:ans})}); }
  catch(e){toast(e.message,'err');return;}
  const box=document.getElementById('sp-check-result');
  if(box)box.innerHTML=r.correct
    ?`<div class="sp-ok">✅ 回答正确：<b>${esc(r.word)}</b></div>`
    :`<div class="sp-err">❌ 回答错误，正确规范词：<b>${esc(r.word)}</b></div>`;
  inp.disabled=true;
  const acts=document.getElementById('sp-actions');if(acts)acts.style.display='flex';
}
async function gradeSp(grade){
  const c=spState.queue[spState.idx];
  try{await api('/api/spwords/review',{method:'POST',body:JSON.stringify({studentKey,wordId:c.id,grade})});}
  catch(e){toast(e.message,'err');return;}
  spState.idx++;
  renderSpCard();
}
function spDone(){
  $('#morning-body').innerHTML=`<div class="card"><h2>🎉 今日记忆完成</h2>
    <p class="muted">系统已按你的选择安排下次复习时间，明天继续。</p>
    <div class="btnrow"><button class="btn" onclick="loadMorning()">返回早读</button></div></div>`;
  loadDashboard();
}
function toggleIds(){const all=[...document.querySelectorAll('.mchk')].map(c=>c.value);const checked=[...document.querySelectorAll('.mchk:checked')].map(c=>c.value);return checked.length?checked:all;}
async function doCheckin(){
  const ids=toggleIds();const willDone=!(morningToday&&morningToday.checkin.done);
  try{await api('/api/morning/checkin',{method:'POST',body:JSON.stringify({studentKey,date:new Date().toISOString().slice(0,10),readingIds:ids,done:willDone})});toast(willDone?'打卡成功':'已取消打卡','ok');loadMorning();loadDashboard();}catch(e){toast(e.message,'err');}
}
async function addMyMorning(){const title=$('#mr-title').value.trim(),content=$('#mr-content').value.trim();if(!title){toast('请填写标题','err');return;}try{await api('/api/morning',{method:'POST',body:JSON.stringify({ownerType:'student',ownerKey:studentKey,title,content})});toast('已添加','ok');$('#mr-title').value='';$('#mr-content').value='';loadMorning();}catch(e){toast(e.message,'err');}}
function renderMyMorning(own){const box=$('#my-morning-list');if(!own||!own.length){box.innerHTML='<p class="muted">还没有自建早读。</p>';return;}box.innerHTML=own.map(m=>`<div class="morning-item"><div class="flex-between"><b>${esc(m.title)}</b><button class="btn danger sm" onclick="delMyMorning('${m.id}')">删除</button></div><div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(m.content||'')}</div></div>`).join('');}
async function delMyMorning(id){if(!confirm('删除该早读？'))return;try{await api('/api/morning/'+id,{method:'DELETE'});toast('已删除','ok');loadMorning();}catch(e){toast(e.message,'err');}}
async function enableMr(){if(!morningToday||!morningToday.items.length){toast('今日没有可加入的早读','err');return;}const ids=morningToday.items.map(m=>m.id);try{const r=await api('/api/morning/memory/enable',{method:'POST',body:JSON.stringify({studentKey,mrids:ids})});toast('已加入记忆：'+r.added+' 张卡','ok');loadMorning();}catch(e){toast(e.message,'err');}}
async function startMr(){
  if(!studentKey){toast('请先登录/注册','err');return;}
  try{const dRaw=await api('/api/morning/memory/due?key='+encodeURIComponent(studentKey));
    const d=(dRaw&&typeof dRaw==='object')?dRaw:{};
    const items=Array.isArray(d.items)?d.items:[];
    if(!items.length){toast('今日没有待复习的早读 🎉','ok');return;}
    mrData=items;mrAnswers={};
    let h=`<h2>早读复习（${items.length} 项）</h2><hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">`;
    items.forEach((m,i)=>{h+=`<div class="q" data-mrid="${m.itemId}"><div class="qt">${i+1}. ${esc(m.title)}</div><div class="muted" style="white-space:pre-wrap;margin-bottom:8px">${esc(m.content||'')}</div><div class="opt" onclick="pickMr('${m.itemId}',0,this)">✅ 记住了</div><div class="opt" onclick="pickMr('${m.itemId}',1,this)">❌ 没记住</div></div>`;});
    h+=`<div class="center" class="mt-4"><button class="btn" onclick="submitMr()">提交复习</button></div>`;
    $('#mr-do-body').innerHTML=h;$('#mr-do').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickMr(mrid,v,el){mrAnswers[mrid]=v;[...el.parentElement.querySelectorAll('.opt')].forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
async function submitMr(){try{const r=(await api('/api/morning/memory/review',{method:'POST',body:JSON.stringify({studentKey,results:mrAnswers})}))||{};const results=Array.isArray(r.results)?r.results:[];const ok=results.length?results.filter(x=>x.isCorrect).length:0;let h=`<div class="result-head"><div class="score">${results.length?Math.round(ok/results.length*100):0}分</div><div class="muted">本次复习 ${results.length} 项</div></div>`;results.forEach((x,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(x.title)} ${x.isCorrect?'<span class="badge judge">✓ 已记住</span>':'<span class="badge err">✗ 再记一次</span>'}</div><div class="ana">下次复习：约 <b>${x.nextIntervalDays}</b> 天后（${x.isCorrect?'间隔拉长':'明天再来'}）</div></div>`;});h+=`<div class="center"><button class="btn ghost" onclick="afterMr()">返回</button></div>`;$('#mr-do-body').innerHTML=h;window.scrollTo(0,0);}catch(e){toast(e.message,'err');}}
async function afterMr(){$('#mr-do').classList.add('hidden');loadMorning();loadDashboard();}
async function renderSchedule(){
  try{
    const cardsRaw=await api('/api/morning/memory/cards?key='+encodeURIComponent(studentKey));
    const cards=Array.isArray(cardsRaw)?cardsRaw:[];
    const buckets={};cards.forEach(c=>{const day=new Date(c.due).toISOString().slice(0,10);(buckets[day]=buckets[day]||[]).push(c);});
    let h='<div class="timeline">';const today=new Date();
    for(let i=0;i<14;i++){const dt=new Date(today);dt.setDate(today.getDate()+i);const day=dt.toISOString().slice(0,10);const items=buckets[day]||[];
      h+=`<div class="tl-item ${items.length?'due':''}"><div><b>${day}${i===0?'（今天）':i===1?'（明天）':''}</b> — ${items.length?items.length+' 项待复习':'无安排'}</div>${items.slice(0,3).map(it=>'<div class="muted">· '+esc(it.title)+'</div>').join('')}</div>`;}
    h+='</div><p class="muted">系统按艾宾浩斯遗忘曲线自动安排每日复习，越记越牢。</p>';
    $('#mr-schedule').innerHTML=h;
  }catch(e){}
}
async function doHomework(id){
  try{
    const listRaw=await api('/api/morning/homework?date='+new Date().toISOString().slice(0,10));
    const list=Array.isArray(listRaw)?listRaw:[];
    const hh=list.find(x=>x.id===id);if(!hh)throw new Error('作业不存在');
    let qids=Array.isArray(hh.questionIds)?hh.questionIds:[];if(!qids.length&&hh.examId){const e=await api('/api/exams/'+hh.examId);qids=Array.isArray(e.questionIds)?e.questionIds:[];}
    const allqRaw=await api('/api/questions');const allq=Array.isArray(allqRaw)?allqRaw:[];const map={};allq.forEach(q=>map[q.id]=q);
    const qs=qids.map(qid=>map[qid]).filter(Boolean);
    if(!qs.length){toast('作业暂无可答题','err');return;}
    hwState={id,answers:{}};
    let h=`<button class="btn ghost sm" onclick="loadMorning()">← 返回早读</button><h2 style="margin:12px 0">📋 ${esc(hh.title)}</h2><hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">`;
    qs.forEach((q,i)=>{h+=`<div class="q" data-qid="${q.id}"><div class="qt">${i+1}. ${esc(q.title)} ${isMultiQ(q)?'<span class="badge multi">多选</span>':''}</div>`+optRowsHTML(q,q.id,'pickHw')+wrongBtnHTML(q.id)+`</div>`;});
    h+=`<div class="center" class="mt-4"><button class="btn" onclick="submitHw()">提交作业</button></div>`;
    $('#morning-body').innerHTML=h;window.scrollTo(0,0);
  }catch(e){toast(e.message,'err');}
}
function pickHw(qid,j,el,multi){pickGen(hwState.answers,qid,j,el,multi);}
async function submitHw(){
  try{const r=(await api('/api/morning/homework/'+hwState.id+'/submit',{method:'POST',body:JSON.stringify({studentKey,studentName:studentName,answers:hwState.answers})}))||{};
    const details=Array.isArray(r.details)?r.details:[];
    let h=`<div class="result-head"><div class="score">${typeof r.score==='number'?r.score:0}分</div><div class="muted">答对 ${r.correct||0} / ${r.total||0} 题</div></div>`;
    details.forEach((d,i)=>{h+=`<div class="q"><div class="qt">${i+1}. ${esc(d.title)} ${d.isCorrect?'<span class="badge judge">✓</span>':'<span class="badge err">✗</span>'}</div>`+detailOptsHTML(d)+(isMultiQ(d)&&hasAns(d)?`<div class="ana">正确答案：<b>${correctLetters(d)}</b></div>`:'')+(d.analysis?`<div class="ana">解析：${esc(d.analysis)}</div>`:'')+`</div>`;});
    h+=`<div class="center"><button class="btn ghost" onclick="loadMorning()">返回早读</button></div>`;
    $('#morning-body').innerHTML=h;window.scrollTo(0,0);loadDashboard();
  }catch(e){toast(e.message,'err');}
}
