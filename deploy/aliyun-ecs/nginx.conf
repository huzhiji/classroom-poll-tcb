# 课堂答题系统 - Nginx 反向代理 + HTTPS 示例
# 用途：阿里云 ECS 上，Nginx 监听 443，把请求转发给 Docker 容器（127.0.0.1:80）
# 使用：
#   1) 把此文件放到 /etc/nginx/conf.d/classroom.conf
#   2) 将 exam.example.com 换成你的域名
#   3) 将证书 .pem / .key 上传到 /etc/nginx/certs/ 并修改路径
#   4) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name exam.example.com;
    # HTTP 自动跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name exam.example.com;

    # 证书路径（阿里云下载的 Nginx 格式证书）
    ssl_certificate     /etc/nginx/certs/exam.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/exam.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 请求体限制（导出/导入数据用，10MB）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 课堂轮询接口需要，防止超时
        proxy_read_timeout 60s;
    }
}
